<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workplan Estimator — Guided (Method 2)</title>
<style>
  :root{
    --amber:#f59e0b; --amber-d:#b45309; --amber-l:#fff8ec; --amber-ll:#fffdf8;
    --ink:#1c1917; --muted:#78716c; --line:#e7e2da; --bg:#faf8f4; --card:#ffffff;
    --good:#15803d; --warn:#b45309; --bad:#b91c1c; --indigo:#4f46e5;
    --mono:"SF Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:26px 22px 90px}
  .brandbar{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px var(--amber-l)}
  .brandbar h1{font-size:15px;margin:0;font-weight:700}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--amber-l);color:var(--amber-d);border:1px solid #f3d9a4}
  .badge.api{background:#eef0ff;color:var(--indigo);border-color:#d6d8ff}
  .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px -18px rgba(0,0,0,.15)}
  .progress{display:flex;gap:6px;margin-bottom:22px}
  .progress i{height:5px;border-radius:5px;background:var(--line);flex:1;transition:.3s}
  .progress i.done{background:var(--amber)}.progress i.now{background:var(--amber-d)}
  .qnum{font-size:12px;font-weight:700;color:var(--amber-d);letter-spacing:.8px;text-transform:uppercase}
  h2.q{font-size:23px;margin:6px 0 4px;font-weight:700;letter-spacing:-.3px}
  .hint{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .choice{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;cursor:pointer;font-size:14px;font-weight:600;text-align:left;transition:.12s;color:var(--ink)}
  .choice:hover{border-color:var(--amber);background:var(--amber-ll)}
  .choice.sel{border-color:var(--amber-d);background:var(--amber-l);box-shadow:inset 0 0 0 1px var(--amber-d)}
  .choice small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:3px}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:9px 15px;cursor:pointer;font-size:13px;font-weight:600;transition:.12s}
  .chip:hover{border-color:var(--amber)}
  .chip.sel{border-color:var(--amber-d);background:var(--amber-l);color:var(--amber-d)}
  .chip .pc{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:5px}
  .chip.sel .pc{color:var(--amber-d)}
  input[type=text],input[type=number]{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff}
  input:focus,textarea:focus{outline:none;border-color:var(--amber)}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14px;font-family:inherit;resize:vertical;min-height:96px}
  .aibox{border:1.5px dashed #c7c9ff;background:#f6f7ff;border-radius:12px;padding:15px 16px;margin-bottom:18px}
  .aibox .lbl{font-size:11.5px;font-weight:700;color:var(--indigo);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:7px;margin-bottom:9px}
  .aibox p{margin:9px 0 0;font-size:12px;color:#6366a3}
  textarea.scope:focus{border-color:var(--indigo)}
  .aifeed{background:#eef0ff;border:1px solid #c7c9ff;border-radius:10px;padding:12px 14px;margin-top:11px;font-size:12.5px;color:#3730a3;line-height:1.7}
  .aifeed.warn{background:#fff7ed;border-color:#fed7aa;color:var(--warn)}
  .aifeed b{color:var(--indigo)}
  .quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .quick button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600}
  .quick button:hover{border-color:var(--amber);color:var(--amber-d)}
  .disc{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px;background:#fff}
  .disc.on{border-color:var(--amber-d);background:var(--amber-ll)}
  .disc input[type=checkbox]{accent-color:var(--amber-d);width:17px;height:17px}
  .disc .nm{flex:1;font-weight:600;font-size:13.5px}
  .disc .pct{width:78px}
  .disc .pct input{padding:7px 9px;text-align:right;font-family:var(--mono);font-size:13px}
  .disc .pcts{font-size:11px;color:var(--muted);width:34px}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
  .btn{border:none;border-radius:11px;padding:13px 26px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--amber);color:#3a2400;box-shadow:0 2px 0 var(--amber-d)}
  .btn.primary:hover{background:#f0a613}
  .btn.primary:disabled{background:#e7e2da;color:#a8a29e;box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:none;color:var(--muted);padding:13px 8px}.btn.ghost:hover{color:var(--ink)}
  .btn.indigo{background:var(--indigo);color:#fff;box-shadow:0 2px 0 #3730a3}
  /* result */
  .headline{display:flex;align-items:center;gap:22px;padding:22px;border-radius:14px;background:var(--amber-l);border:1px solid #f3d9a4}
  .gauge{position:relative;width:96px;height:96px;flex:none}.gauge svg{transform:rotate(-90deg)}
  .gauge .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .pct b{font-size:26px;line-height:1}.gauge .pct span{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
  .hl-text h3{margin:0 0 3px;font-size:19px}.hl-text p{margin:0;font-size:13px;color:var(--amber-d)}
  .band{display:inline-block;font-size:11px;font-weight:800;padding:2px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
  .band.High{background:#dcfce7;color:var(--good)}.band.Moderate{background:#fef3c7;color:var(--warn)}.band.Low{background:#fee2e2;color:var(--bad)}
  .methodnote{background:#f6f7ff;border:1px solid #dfe1ff;border-radius:10px;padding:11px 14px;font-size:12.5px;color:#4338ca;margin:14px 0 0}
  .sec{margin-top:24px}
  .sec h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--amber-d);margin:0 0 10px;font-weight:800}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
  tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none}
  tr.grand td{font-weight:800;background:var(--amber-l);color:var(--amber-d);border-top:2px solid var(--amber-d);font-size:13.5px}
  .simbar{display:inline-block;height:7px;border-radius:4px;background:var(--amber);vertical-align:middle;margin-right:7px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpi{background:var(--amber-ll);border:1px solid var(--line);border-radius:12px;padding:15px}
  .kpi b{font-size:25px;font-weight:800;display:block;letter-spacing:-.5px}
  .kpi span{font-size:11.5px;color:var(--muted);font-weight:600}
  .flag{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--warn);margin-top:10px;display:flex;gap:9px}
  .flag b{color:var(--amber-d)}
  .flag.good{background:#f0fdf4;border-color:#bbf7d0;color:var(--good)}
  .flag.bad{background:#fef2f2;border-color:#fecaca;color:var(--bad)}
  .audit{font-size:13px;color:var(--muted)}.audit li{margin:5px 0}
  .rolebar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .rolebar .fill{height:20px;border-radius:5px;background:linear-gradient(90deg,var(--amber),var(--amber-d));min-width:2px}
  .disclaimer{font-size:12px;color:var(--muted);margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
  .modrow td:first-child{font-weight:600}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tab{border:1.5px solid var(--line);background:#fff;border-radius:9px 9px 0 0;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
  .tab:hover{border-color:var(--amber)}
  .tab.on{border-color:var(--amber-d);background:var(--amber-l);color:var(--amber-d)}
  .tab .tn{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600}.tab.on .tn{color:var(--amber-d)}
  .hin{width:96px;border:1.5px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;font-family:var(--mono);text-align:right}.hin:focus{outline:none;border-color:var(--amber)}
  .tagcov{font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:#e0e7ff;color:#3730a3;margin-left:6px}
  .tagapp{font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:#fef3c7;color:var(--warn);margin-left:6px}
  @media(max-width:600px){.kpis{grid-template-columns:1fr}.headline{flex-direction:column;text-align:center}}

  .toggle{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
  .tg{border:none;background:#fff;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);font-family:inherit;border-right:1px solid var(--line)}
  .tg:last-child{border-right:none}.tg:hover{background:var(--amber-ll)}.tg.on{background:var(--amber-l);color:var(--amber-d)}
  tr.ext{background:#f6f7ff}
  .sin{border:1.5px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12.5px;font-family:inherit}.sin:focus{outline:none;border-color:var(--amber)}
  .xrow{border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px}.xrow:hover{color:var(--bad)}
  .totgrid{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .tt{display:flex;justify-content:space-between;padding:8px 14px;font-size:13px;border-bottom:1px solid var(--line)}
  .tt span{color:var(--muted)}.tt b{font-family:var(--mono)}
  .tt.amber{background:var(--amber-ll)}.tt.amber b{color:var(--amber-d)}
  .tt.grand{background:var(--amber-l);border-bottom:none}.tt.grand b{color:var(--amber-d);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <span class="dot"></span><h1>Workplan Estimator</h1>
    <span class="badge">Method 2 · Guided web app</span>
    <span class="badge api">AI / API-connectable</span>
  </div>
  <p class="sub">Method 1's interview — the PM's workplan intake — as a self-serve web app. Paste the client scope or answer the questions; it blends comparable past projects, splits the work by phase, discipline and role, and shows every number.</p>
  <div class="card" id="card"></div>
</div>

<script>
/* ============================================================================
 * Workplan Estimator — deterministic engine (JavaScript port)
 * ----------------------------------------------------------------------------
 * Faithful port of score_comparables.py + estimate_resourcing.py.
 * Same arithmetic, same weights, same bars — so the HTML tools produce the
 * identical numbers to the Python scripts / the Claude demo.
 *
 * Reference date is pinned so the demo is reproducible on any day.
 * Parity-verified against the Python output for demo_candidates.json:
 *   84% High · A 0.838 / B 0.684 / D 0.640 / C 0.555 · 8659.0h
 *   drop C -> 86% High · 8880.5h
 * ========================================================================== */
(function (root) {
  "use strict";

  // Pinned so recency scoring is identical to the 2026-07-23 ground-truth run.
  // (The real script uses date.today(); we pin it for a stable live demo.)
  var REFERENCE_DATE = new Date(Date.UTC(2026, 6, 23)); // months are 0-based

  var MIN_COMPARABLES_BEFORE_BROADENING = 3;
  var MIN_SCORE_BAR = 0.35;
  var MAX_SELECTED = 5;
  var MIN_SELECTED = 3;
  var MAX_TOTAL_UPLIFT = 0.5;

  var WEIGHTS = { typology: 0.4, gfa: 0.25, modifiers: 0.25, recency: 0.1 };

  var CONFIDENCE_WEIGHTS = {
    depth: 0.3,
    match_quality: 0.3,
    typology_fidelity: 0.15,
    modifier_coverage: 0.15,
    gfa_proximity: 0.1,
  };
  var CONFIDENCE_FALLBACK_CAP = 30;
  var CONFIDENCE_BANDS = [ [70, "High"], [45, "Moderate"], [0, "Low"] ];

  var DEFAULT_ADJACENCY = {
    "Elder Care": ["Healthcare"],
    "Healthcare": ["Elder Care"],
    "Municipal": ["Institutional"],
    "Institutional": ["Municipal"],
    "Recreation Centre": ["Arena"],
    "Arena": ["Recreation Centre"],
    "Multi-Use Residential": ["Residential"],
    "Residential": ["Multi-Use Residential"],
  };

  // Indicative blended rate ($/hr). The production tool uses DIALOG's full
  // discipline/title rate taxonomy; this single blended figure reproduces the
  // runbook's "indicative fee" and is always labelled indicative, never final.
  var INDICATIVE_BLENDED_RATE = 208;

  function round(v, n) {
    var f = Math.pow(10, n || 0);
    return Math.round(v * f) / f;
  }

  function gfaScore(newGfa, candGfa) {
    if (!newGfa || !candGfa || newGfa <= 0 || candGfa <= 0) return 0.0;
    var diff = Math.abs(Math.log(newGfa) - Math.log(candGfa));
    return Math.max(0.0, 1.0 - diff / 1.4);
  }

  function modifierScore(newMods, candMods) {
    var a = new Set(newMods || []);
    var b = new Set(candMods || []);
    if (a.size === 0 && b.size === 0) return 1.0;
    var union = new Set([].concat(newMods || [], candMods || []));
    if (union.size === 0) return 1.0;
    var inter = 0;
    a.forEach(function (x) { if (b.has(x)) inter++; });
    return inter / union.size;
  }

  function recencyScore(dateStr, today) {
    if (!dateStr) return 0.5;
    var parts = String(dateStr).split("-");
    if (parts.length !== 3) return 0.5;
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
    if (isNaN(y) || isNaN(m) || isNaN(d)) return 0.5;
    var then = new Date(Date.UTC(y, m - 1, d));
    var ageYears = (today.getTime() - then.getTime()) / (1000 * 60 * 60 * 24) / 365.25;
    return Math.max(0.0, 1.0 - ageYears / 10.0);
  }

  function scoreCandidate(newProject, cand, today, adjacency) {
    var newTyp = newProject.typology, candTyp = cand.typology;
    var typScore;
    if (newTyp === candTyp) typScore = 1.0;
    else if ((adjacency[newTyp] || []).indexOf(candTyp) !== -1) typScore = 0.6;
    else typScore = 0.0;

    var g = gfaScore(newProject.gfa, cand.gfa);
    var m = modifierScore(newProject.modifiers, cand.modifiers);
    var r = recencyScore(cand.date_curated, today);

    var total = WEIGHTS.typology * typScore + WEIGHTS.gfa * g +
      WEIGHTS.modifiers * m + WEIGHTS.recency * r;

    return {
      project_code: cand.project_code,
      typology_score: round(typScore, 3),
      gfa_score: round(g, 3),
      modifier_score: round(m, 3),
      recency_score: round(r, 3),
      total_score: round(total, 3),
      typology_match: typScore === 1.0 ? "exact" : (typScore === 0.6 ? "adjacent" : "none"),
    };
  }

  function blendHours(newProject, selectedFull) {
    var weightSum = 0;
    selectedFull.forEach(function (p) { weightSum += p.score.total_score; });
    if (weightSum === 0) weightSum = 1.0;

    var buckets = {};
    selectedFull.forEach(function (p) {
      var cand = p.cand, score = p.score;
      var gfaRatio = 1.0;
      if (newProject.gfa && cand.gfa && cand.gfa > 0) gfaRatio = newProject.gfa / cand.gfa;
      var w = score.total_score / weightSum;
      (cand.workplan_lines || []).forEach(function (line) {
        var key = [line.phase, line.role_discipline, line.role_seniority].join("␀");
        var scaled = (line.hours || 0) * gfaRatio;
        buckets[key] = (buckets[key] || 0) + scaled * w;
      });
    });

    var grid = Object.keys(buckets).sort().map(function (k) {
      var parts = k.split("␀");
      return { phase: parts[0], role_discipline: parts[1], role_seniority: parts[2], hours: round(buckets[k], 1) };
    }).filter(function (row) { return buckets[[row.phase, row.role_discipline, row.role_seniority].join("␀")] > 0.05; });

    return grid;
  }

  function applyModifierAdjustment(newProject, selectedFull, modifierDefaults) {
    var covered = new Set();
    selectedFull.forEach(function (p) { (p.cand.modifiers || []).forEach(function (m) { covered.add(m); }); });
    var uncovered = (newProject.modifiers || []).filter(function (m) { return !covered.has(m); });

    var applied = {}, warnings = [], totalUplift = 0.0;
    uncovered.forEach(function (m) {
      var pct = modifierDefaults[m];
      if (pct === undefined || pct === null) {
        warnings.push("Modifier '" + m + "' has no comparable coverage and no Default Adjustment % set -- its effect is not represented in this estimate.");
        return;
      }
      applied[m] = pct;
      totalUplift += pct;
    });

    var capped = false;
    if (totalUplift > MAX_TOTAL_UPLIFT) { capped = true; totalUplift = MAX_TOTAL_UPLIFT; }

    return {
      result: { uncovered_modifiers: uncovered, applied_defaults: applied, total_uplift_pct: round(totalUplift, 4), capped: capped },
      warnings: warnings,
    };
  }

  function computeConfidence(selectedScores, selectedFull, newProject, modifierDefaults, usedFallback) {
    var factors = [];
    if (!selectedScores.length) {
      var z = {}; Object.keys(CONFIDENCE_WEIGHTS).forEach(function (k) { z[k] = 0.0; });
      return { confidence_pct: 0, band: "Low", drivers: z, factors: ["No comparables selected -- nothing to build confidence on."], fallback_capped: false };
    }

    var nAbove = usedFallback ? 0 : selectedScores.filter(function (s) { return s.total_score >= MIN_SCORE_BAR; }).length;
    var depth = ({ 0: 0.0, 1: 0.4, 2: 0.7 })[nAbove];
    if (depth === undefined) depth = 1.0;
    factors.push(nAbove + " comparable(s) cleared the " + MIN_SCORE_BAR + " similarity bar" + (usedFallback ? " (fallback below bar used)" : ""));

    var scores = selectedScores.map(function (s) { return s.total_score; });
    var matchQuality = scores.reduce(function (a, b) { return a + b; }, 0) / scores.length;
    factors.push("mean similarity of selected comparables = " + round(matchQuality, 3));

    var exact = selectedScores.filter(function (s) { return s.typology_match === "exact"; }).length;
    var typologyFidelity = exact / selectedScores.length;
    factors.push(exact + "/" + selectedScores.length + " selected are exact-typology matches");

    var newMods = newProject.modifiers || [];
    var modifierCoverage;
    if (!newMods.length) {
      modifierCoverage = 1.0;
      factors.push("no complexity modifiers to cover");
    } else {
      var covered = new Set();
      selectedFull.forEach(function (p) { (p.cand.modifiers || []).forEach(function (m) { covered.add(m); }); });
      var perMod = [], seen = [], defaulted = [], uncov = [];
      newMods.forEach(function (m) {
        if (covered.has(m)) { perMod.push(1.0); seen.push(m); }
        else if (modifierDefaults[m] !== undefined && modifierDefaults[m] !== null) { perMod.push(0.5); defaulted.push(m); }
        else { perMod.push(0.0); uncov.push(m); }
      });
      modifierCoverage = perMod.reduce(function (a, b) { return a + b; }, 0) / perMod.length;
      factors.push("modifiers: " + seen.length + " seen in comparables, " + defaulted.length + " via unvalidated default %, " + uncov.length + " uncovered");
    }

    var gfas = selectedScores.map(function (s) { return s.gfa_score || 0.0; });
    var gfaProximity = gfas.reduce(function (a, b) { return a + b; }, 0) / gfas.length;
    factors.push("mean GFA-proximity of selected = " + round(gfaProximity, 3));

    var drivers = {
      depth: round(depth, 3),
      match_quality: round(matchQuality, 3),
      typology_fidelity: round(typologyFidelity, 3),
      modifier_coverage: round(modifierCoverage, 3),
      gfa_proximity: round(gfaProximity, 3),
    };
    var raw = 0;
    Object.keys(CONFIDENCE_WEIGHTS).forEach(function (k) { raw += CONFIDENCE_WEIGHTS[k] * drivers[k]; });
    raw *= 100;

    var fallbackCapped = false;
    if (usedFallback && raw > CONFIDENCE_FALLBACK_CAP) { raw = CONFIDENCE_FALLBACK_CAP; fallbackCapped = true; factors.push("capped at " + CONFIDENCE_FALLBACK_CAP + "% because no comparable cleared the bar"); }

    var pct = Math.round(raw);
    var band = "Low";
    for (var i = 0; i < CONFIDENCE_BANDS.length; i++) { if (pct >= CONFIDENCE_BANDS[i][0]) { band = CONFIDENCE_BANDS[i][1]; break; } }

    return { confidence_pct: pct, band: band, drivers: drivers, factors: factors, fallback_capped: fallbackCapped };
  }

  function scoreComparables(data) {
    var newProject = data.new_project;
    var candidates = data.candidates || [];
    var modifierDefaults = data.modifier_defaults || {};
    var exampleMode = !!data.example_mode;

var VOCAB = WorkplanEngine.REAL_MODIFIERS;               // [{name,pct}]
var DISC = WorkplanEngine.REAL_DISCIPLINES;              // [{name,pct,prime}]
var TYPOLOGIES = ["Institutional","Healthcare","Lab","Commercial","Office","Residential",
  "Multi-Use Residential","Recreation Centre","Arena","Elder Care","Municipal","Transit","Airport",
  "Hospitality","Retail","Industrial","Renovation","Planning"];

function defDisc(){ return DISC.filter(function(d){return d.pct>0;}).map(function(d){return {name:d.name,pct:d.pct,on:true};})
  .concat(DISC.filter(function(d){return d.pct===0;}).map(function(d){return {name:d.name,pct:0,on:false};})); }

var state = { step:0, scope:'', engagement:'full', primeDisc:'Architecture / Prime', soloDisc:'Structural', typology:null, gfa:null, disciplines:defDisc(), modifiers:[], value:null, useDefaults:true, droppedC:false };
var TOTAL_STEPS = 6;
var card = document.getElementById('card');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function progress(n){var h='<div class="progress">';for(var i=0;i<TOTAL_STEPS;i++)h+='<i class="'+(i<n?'done':(i===n?'now':''))+'"></i>';return h+'</div>';}
function nav(backLabel,nextLabel,nextEnabled,nextFn,backFn){
  var h='<div class="nav">';
  h+= backFn?'<button class="btn ghost" id="back">‹ '+backLabel+'</button>':'<span></span>';
  h+= '<button class="btn primary" id="next" '+(nextEnabled?'':'disabled')+'>'+nextLabel+'</button></div>';
  setTimeout(function(){var b=document.getElementById('back'),nx=document.getElementById('next');if(b&&backFn)b.onclick=backFn;if(nx)nx.onclick=nextFn;},0);
  return h;
}

function render(){
  var s=state.step;
  if(s===0)return welcome();
  if(s===1)return qTypology();
  if(s===2)return qGfa();
  if(s===3)return qDisc();
  if(s===4)return qModifiers();
  if(s===5)return qValue();
  if(s===6)return qDurations();
  if(s===7)return result();
}

function welcome(){
  var LEADS=[['Architecture / Prime','Architecture'],['Structural','Structural'],['Mechanical','Mechanical'],['Electrical','Electrical']];
  var ENG=[['full','Fully integrated','DIALOG delivers every discipline'],
    ['prime','Prime only','DIALOG leads; other disciplines are outside consultants'],
    ['solo','Single discipline','DIALOG provides just one discipline (sub-consultant)'],
    ['custom','Custom / split','Set companies &amp; splits yourself in the breakdown']];
  var h='<span class="qnum">New project intake</span><h2 class="q">How is DIALOG involved?</h2>'+
    '<p class="hint">Set this first — it presets who does what. Prime isn\'t always Architecture; pick the lead discipline, then DIALOG\'s role. You can fine-tune companies and splits later.</p>'+
    '<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:6px">LEAD / PRIME DISCIPLINE</div><div class="chips">'+
      LEADS.map(function(l){return '<button class="chip '+(state.primeDisc===l[0]?'sel':'')+'" data-lead="'+l[0]+'">'+l[1]+'</button>';}).join('')+'</div></div>'+
    '<div class="choices" style="grid-template-columns:1fr 1fr">'+
      ENG.map(function(e){return '<button class="choice '+(state.engagement===e[0]?'sel':'')+'" data-eng="'+e[0]+'">'+e[1]+'<small>'+e[2]+'</small></button>';}).join('')+'</div>';
  if(state.engagement==='solo') h+='<div style="margin-top:10px"><div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:6px">WHICH DISCIPLINE DOES DIALOG PROVIDE?</div><div class="chips">'+
      LEADS.map(function(l){return '<button class="chip '+(state.soloDisc===l[0]?'sel':'')+'" data-solo="'+l[0]+'">'+l[1]+'</button>';}).join('')+'</div></div>';
  h+='<div class="aibox" style="margin-top:18px"><div class="lbl">◇ AI layer — client scope outline (optional)</div>'+
      '<textarea class="scope" id="scope" placeholder="Paste the client prompt / RFP text here — e.g. \'Seeking design services for a new 7,500 m² post-secondary academic building, targeting LEED Gold, on an accelerated schedule. Construction budget approx. $42M...\'">'+esc(state.scope||'')+'</textarea>'+
      '<button class="btn indigo" id="readscope" style="margin-top:11px;padding:10px 18px;font-size:13px">✦ Read scope &amp; pre-fill</button>'+
      '<div id="aifeed"></div>'+
      '<p>In production this is Claude reading the scope doc. Here a local interpreter extracts typology, size, and complexity signals — the arithmetic underneath is identical.</p></div>'+
    nav('','Start  ›',true,function(){state.step=1;render();},null);
  card.innerHTML=h;
  Array.prototype.forEach.call(card.querySelectorAll('[data-lead]'),function(b){b.onclick=function(){state.primeDisc=b.dataset.lead;render();};});
  Array.prototype.forEach.call(card.querySelectorAll('[data-eng]'),function(b){b.onclick=function(){state.engagement=b.dataset.eng;render();};});
  Array.prototype.forEach.call(card.querySelectorAll('[data-solo]'),function(b){b.onclick=function(){state.soloDisc=b.dataset.solo;render();};});
  document.getElementById('scope').oninput=function(){state.scope=this.value;};
  document.getElementById('readscope').onclick=function(){interpret(state.scope);};
}

function interpret(txt){
  var feed=document.getElementById('aifeed');
  if(!txt||!txt.trim()){if(feed)feed.innerHTML='<div class="aifeed warn">Paste some scope text first.</div>';return;}
  var low=' '+txt.toLowerCase()+' ';
  var map=[['post-secondary','Institutional'],['academic','Institutional'],['school','Institutional'],['university','Institutional'],['college','Institutional'],['campus','Institutional'],['classroom','Institutional'],
    ['hospital','Healthcare'],['clinic','Healthcare'],['health centre','Healthcare'],['healthcare','Healthcare'],['medical','Healthcare'],
    ['laboratory','Lab'],['research lab','Lab'],[' lab ','Lab'],
    ['airport','Airport'],['terminal','Airport'],['transit','Transit'],['rail station','Transit'],['bus ','Transit'],['light rail','Transit'],
    ['apartment','Residential'],['condominium','Multi-Use Residential'],['mixed-use','Multi-Use Residential'],['mixed use','Multi-Use Residential'],['housing','Residential'],['residential','Residential'],
    ['office','Office'],['workplace','Office'],
    ['arena','Arena'],['rink','Arena'],['stadium','Arena'],['recreation','Recreation Centre'],['rec centre','Recreation Centre'],['community centre','Recreation Centre'],['aquatic','Recreation Centre'],
    ['retail','Retail'],['store','Retail'],['shopping','Retail'],
    ['hotel','Hospitality'],['resort','Hospitality'],
    ['long-term care','Elder Care'],['long term care','Elder Care'],['seniors','Elder Care'],['nursing home','Elder Care'],
    ['city hall','Municipal'],['municipal','Municipal'],['library','Municipal'],['fire hall','Municipal'],
    ['warehouse','Industrial'],['industrial','Industrial'],['manufacturing','Industrial'],
    ['renovation','Renovation'],['master plan','Planning']];
  var typ=null;for(var i=0;i<map.length;i++){if(low.indexOf(map[i][0])!==-1){typ=map[i][1];break;}}
  if(typ)state.typology=typ;
  var gfa=null;
  var num=low.match(/(\d[\d,\. ]*)\s*(m²|m2|sqm|sq\.?\s?m|square\s*met)/);
  if(num)gfa=Math.round(parseFloat(num[1].replace(/[, ]/g,'')));
  if(!gfa){var k=low.match(/(\d[\d\.]*)\s*k\b/);if(k)gfa=Math.round(parseFloat(k[1])*1000);}
  if(!gfa){var nums=(low.match(/\d[\d,\.]*/g)||[]).map(function(n){return parseFloat(n.replace(/,/g,''));}).filter(function(n){return n>=800&&n<=400000;});if(nums.length)gfa=Math.round(Math.max.apply(null,nums));}
  if(gfa)state.gfa=gfa;
  var mods=[];
  function add(rx,name){if(rx.test(low)&&mods.indexOf(name)===-1)mods.push(name);}
  add(/leed|sustainab|net.?zero|carbon|passive house|green building|energy target/,"Sustainability Certification Target");
  add(/fast.?track|tight schedule|accelerat|aggressive schedule|compressed|tight timeline|expedited/,"Fast-Track Schedule");
  add(/heritage|historic/,"Heritage Building");
  add(/renovation|retrofit|existing building/,"Existing Building Renovation (Non-Heritage)");
  add(/phased|occupied|stay.?in.?place/,"Phased / Occupied Construction");
  add(/stakeholder|public consultation|community engagement|user groups/,"Stakeholder-Group Count");
  add(/pool|natatorium|aquatic/,"Pool / Natatorium");
  add(/tall building|high.?rise|tower/,"Tall Building");
  add(/campus|multi-building|multiple buildings/,"Multi-Building Campus");
  add(/first.?time client|new client/,"First-Time Client");
  add(/complex code|code complexity|building code/,"Code Complexity");
  add(/difficult site|unusual site|contaminated|brownfield/,"Unusual Site Conditions");
  if(mods.length)state.modifiers=mods;
  var cv=low.match(/\$?\s*([\d\.]+)\s*(m|million)\b/);if(cv)state.value=Math.round(parseFloat(cv[1])*1e6);
  render();
  var f2=document.getElementById('aifeed');
  if(f2){
    var g=[];
    g.push(typ?'Typology → <b>'+esc(typ)+'</b>':'Typology → <i>not detected — pick below</i>');
    g.push(gfa?'GFA → <b>'+gfa.toLocaleString()+' m²</b>':'GFA → <i>not detected</i>');
    g.push(mods.length?'Modifiers → <b>'+mods.map(esc).join(', ')+'</b>':'Modifiers → <i>none detected</i>');
    if(state.value)g.push('Construction value → <b>$'+(state.value/1e6)+'M</b>');
    var ready=typ&&gfa;
    f2.innerHTML='<div class="aifeed"><b>✦ AI read the scope:</b><br>'+g.join('<br>')+
      (ready?'<br><button class="btn indigo" id="airun" style="margin-top:11px;padding:9px 18px;font-size:13px">Use this → full estimate</button> <button class="btn ghost" id="aireview" style="font-size:13px">review step by step</button>'
            :'<br><span style="color:var(--muted);font-size:12px">Some fields missing — continue the interview to fill them.</span>')+'</div>';
    var ff=document.getElementById('scope'); if(ff) ff.value=state.scope;
    var ar=document.getElementById('airun'); if(ar) ar.onclick=function(){state.step=7;render();};

/* ---- build input + result ---- */
function buildInput(){
  var input;
  if(state.typology==='Institutional'){
    var d=JSON.parse(JSON.stringify(DEMO_DATA));
    d.new_project.gfa=state.gfa; d.new_project.modifiers=state.modifiers.slice();
    d.modifier_defaults=JSON.parse(JSON.stringify(WorkplanEngine.REAL_MODIFIER_DEFAULTS));
    if(state.droppedC) d.candidates=d.candidates.filter(function(c){return c.project_code!=='C';});
    input=d;
  } else {
    input=WorkplanEngine.makeExample(state.typology,state.gfa,state.modifiers,4);
    input.modifier_defaults=JSON.parse(JSON.stringify(WorkplanEngine.REAL_MODIFIER_DEFAULTS));
  }
  return input;
}
function selectedDisc(){ return state.disciplines.filter(function(d){return d.on&&d.pct>0;}).map(function(d){return {name:d.name,pct:d.pct};}); }

/* ---- editable result view: scope lines + companies ---- */
var EM=null, feeView='dialog', scopeLines=[];
var SCOPE_DISC=["Architecture / Prime","Structural","Mechanical","Electrical","Interior Design","Landscape Architecture","Civil","AV / Signage","Other"];
var DISC_RATE={"Structural":200,"Mechanical":195,"Electrical":195,"Interior Design":180,"Landscape Architecture":185,"Civil":190,"AV / Signage":185,"Other":185};
var COORD_ADJ={}; // Disciplines.Coordination Adjust % — all 0 in the base today; hook kept live.
function coordAdj(name){return COORD_ADJ[name]||0;}
function discBlendRate(name){return DISC_RATE[name]||190;}

function discHours(d){return Math.round(d.roles.reduce(function(a,r){return a+(parseFloat(r.hours)||0);},0)*10)/10;}
function discFee(d){return d.roles.reduce(function(a,r){return a+Math.round((parseFloat(r.hours)||0)*r.rate);},0);}

/* entry from step dispatcher — recompute from inputs (resets edits + scope) */
function result(){
  var input=buildInput();
  var F=WorkplanEngine.fullEstimate(input,{disciplines:selectedDisc(),constructionValue:state.value});
  var s=F.scored;
  EM={conf:s.confidence,example:s.example_mode,broadened:s.broadened_typology_search,warnings:s.warnings,
    selected:s.selected,allCandidates:input.candidates,byPhase:F.by_phase,primeHours:F.prime_hours,primeFee:F.prime_fee,
    byRole:F.by_role,modLines:F.modifier_breakdown.lines,uplift:F.modifier_breakdown.uplift_applied,capped:F.modifier_breakdown.capped,
    raic:F.raic,resourcing:F.resourcing,byDiscipline:F.by_discipline};
  initScope();
  renderResult();
}
function initScope(){
  scopeLines=[];
  var lead=state.primeDisc||'Architecture / Prime';
  var primeRate=EM.primeHours?Math.round(EM.primeFee/EM.primeHours):200;
  var RD=WorkplanEngine.REAL_DISCIPLINES, shareOf={}; RD.forEach(function(d){shareOf[d.name]=d.pct;});
  var names=EM.byDiscipline.map(function(d){return d.name;});
  if(names.indexOf(lead)===-1) names.unshift(lead);
  var PA=0.52, total=Math.round(EM.primeHours/PA), pool=total-EM.primeHours; // prime carries ~52%; rest split the remainder
  var others=names.filter(function(n){return n!==lead;}), osum=0;
  others.forEach(function(n){osum+=(shareOf[n]||0.05);}); if(osum<=0)osum=1;
  names.forEach(function(n){
    var isLead=(n===lead);
    var hrs=isLead?Math.round(EM.primeHours):Math.round(pool*(shareOf[n]||0.05)/osum);
    var rate=isLead?(lead==='Architecture / Prime'?primeRate:discBlendRate(n)):discBlendRate(n);
    scopeLines.push({disc:n,sub:'',company:'DIALOG',inhouse:true,hours:hrs,rate:rate,prime:isLead});
  });
  applyEngagement();
}
function applyEngagement(){
  var e=state.engagement||'full', lead=state.primeDisc||'Architecture / Prime', solo=state.soloDisc||lead;
  scopeLines.forEach(function(l){
    if(e==='full') l.inhouse=true;
    else if(e==='prime') l.inhouse=(l.disc===lead);
    else if(e==='solo') l.inhouse=(l.disc===solo);
    // custom: leave as initialised (all DIALOG) for the user to edit
    if(l.inhouse){ if(!l.company||/consultant|external/i.test(l.company)) l.company='DIALOG'; }
    else { if(l.company==='DIALOG') l.company='External consultant'; }
  });
}
function setMode(m){
  if(m==='full') scopeLines.forEach(function(l){l.inhouse=true;});
  else if(m==='arch') scopeLines.forEach(function(l){l.inhouse=(l.disc==='Architecture / Prime');});
  renderResult();
}
function scopeTotals(){
  var dialogBase=0,consultant=0,coord=0;
  scopeLines.forEach(function(l){var fee=Math.round((parseFloat(l.hours)||0)*l.rate);
    if(l.inhouse) dialogBase+=fee; else { consultant+=fee; coord+=Math.round(fee*coordAdj(l.disc)); }});
  var dialogFee=Math.round((dialogBase+coord)*(1+EM.uplift));
  var totalHours=Math.round(scopeLines.reduce(function(a,l){return a+(parseFloat(l.hours)||0);},0));
  var dialogHours=Math.round(scopeLines.filter(function(l){return l.inhouse;}).reduce(function(a,l){return a+(parseFloat(l.hours)||0);},0));
  return {dialogBase:dialogBase,coord:coord,consultant:consultant,dialogFee:dialogFee,total:dialogFee+consultant,totalHours:totalHours,dialogHours:dialogHours};
}

  h+='<div class="nav"><button class="btn ghost" id="restart">‹ New estimate</button><span></span></div>';
  card.innerHTML=h;

  Array.prototype.forEach.call(card.querySelectorAll('.tg[data-fv]'),function(b){b.onclick=function(){feeView=b.dataset.fv;renderResult();};});
  Array.prototype.forEach.call(card.querySelectorAll('.tg[data-mode]'),function(b){b.onclick=function(){setMode(b.dataset.mode);};});
  Array.prototype.forEach.call(card.querySelectorAll('.sin'),function(inp){inp.onchange=function(){var l=scopeLines[inp.dataset.i],k=inp.dataset.k;l[k]=(k==='hours'||k==='rate')?(parseFloat(inp.value)||0):inp.value;renderResult();};});
  Array.prototype.forEach.call(card.querySelectorAll('.sck'),function(cb){cb.onchange=function(){scopeLines[cb.dataset.i].inhouse=cb.checked;renderResult();};});
  Array.prototype.forEach.call(card.querySelectorAll('.xrow'),function(b){b.onclick=function(){scopeLines.splice(b.dataset.del,1);renderResult();};});
  var al=document.getElementById('addline');if(al)al.onclick=function(){var dn=document.getElementById('addsel').value;scopeLines.push({disc:dn,sub:'',company:'DIALOG',inhouse:true,hours:0,rate:discBlendRate(dn),prime:false});renderResult();};
  var dc=document.getElementById('dropc');if(dc)dc.onclick=function(){state.droppedC=true;result();};
  var rc=document.getElementById('restorec');if(rc)rc.onclick=function(){state.droppedC=false;result();};
  document.getElementById('restart').onclick=function(){state={step:0,scope:'',engagement:'full',soloDisc:'Architecture / Prime',typology:null,gfa:null,disciplines:defDisc(),modifiers:[],value:null,useDefaults:true,droppedC:false};render();};
}

render();
</script>
</body>
