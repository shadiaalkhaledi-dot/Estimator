<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workplan Estimator — Guided (Method 2)</title>
<style>
  :root{
    --amber:#f59e0b; --amber-d:#b45309; --amber-l:#fff8ec; --amber-ll:#fffdf8;
    --ink:#1c1917; --muted:#78716c; --line:#e7e2da; --bg:#faf8f4; --card:#ffffff;
    --good:#15803d; --warn:#b45309; --bad:#b91c1c; --indigo:#4f46e5;
    --mono:"SF Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:26px 22px 90px}
  .brandbar{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px var(--amber-l)}
  .brandbar h1{font-size:15px;margin:0;font-weight:700}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--amber-l);color:var(--amber-d);border:1px solid #f3d9a4}
  .badge.api{background:#eef0ff;color:var(--indigo);border-color:#d6d8ff}
  .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px -18px rgba(0,0,0,.15)}
  .progress{display:flex;gap:6px;margin-bottom:22px}
  .progress i{height:5px;border-radius:5px;background:var(--line);flex:1;transition:.3s}
  .progress i.done{background:var(--amber)}.progress i.now{background:var(--amber-d)}
  .qnum{font-size:12px;font-weight:700;color:var(--amber-d);letter-spacing:.8px;text-transform:uppercase}
  h2.q{font-size:23px;margin:6px 0 4px;font-weight:700;letter-spacing:-.3px}
  .hint{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .choice{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;cursor:pointer;font-size:14px;font-weight:600;text-align:left;transition:.12s;color:var(--ink)}
  .choice:hover{border-color:var(--amber);background:var(--amber-ll)}
  .choice.sel{border-color:var(--amber-d);background:var(--amber-l);box-shadow:inset 0 0 0 1px var(--amber-d)}
  .choice small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:3px}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:9px 15px;cursor:pointer;font-size:13px;font-weight:600;transition:.12s}
  .chip:hover{border-color:var(--amber)}
  .chip.sel{border-color:var(--amber-d);background:var(--amber-l);color:var(--amber-d)}
  .chip .pc{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:5px}
  .chip.sel .pc{color:var(--amber-d)}
  input[type=text],input[type=number]{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff}
  input:focus,textarea:focus{outline:none;border-color:var(--amber)}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14px;font-family:inherit;resize:vertical;min-height:96px}
  .aibox{border:1.5px dashed #c7c9ff;background:#f6f7ff;border-radius:12px;padding:15px 16px;margin-bottom:18px}
  .aibox .lbl{font-size:11.5px;font-weight:700;color:var(--indigo);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:7px;margin-bottom:9px}
  .aibox p{margin:9px 0 0;font-size:12px;color:#6366a3}
  textarea.scope:focus{border-color:var(--indigo)}
  .aifeed{background:#eef0ff;border:1px solid #c7c9ff;border-radius:10px;padding:12px 14px;margin-top:11px;font-size:12.5px;color:#3730a3;line-height:1.7}
  .aifeed.warn{background:#fff7ed;border-color:#fed7aa;color:var(--warn)}
  .aifeed b{color:var(--indigo)}
  .quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .quick button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600}
  .quick button:hover{border-color:var(--amber);color:var(--amber-d)}
  .disc{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px;background:#fff}
  .disc.on{border-color:var(--amber-d);background:var(--amber-ll)}
  .disc input[type=checkbox]{accent-color:var(--amber-d);width:17px;height:17px}
  .disc .nm{flex:1;font-weight:600;font-size:13.5px}
  .disc .pct{width:78px}
  .disc .pct input{padding:7px 9px;text-align:right;font-family:var(--mono);font-size:13px}
  .disc .pcts{font-size:11px;color:var(--muted);width:34px}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
  .btn{border:none;border-radius:11px;padding:13px 26px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--amber);color:#3a2400;box-shadow:0 2px 0 var(--amber-d)}
  .btn.primary:hover{background:#f0a613}
  .btn.primary:disabled{background:#e7e2da;color:#a8a29e;box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:none;color:var(--muted);padding:13px 8px}.btn.ghost:hover{color:var(--ink)}
  .btn.indigo{background:var(--indigo);color:#fff;box-shadow:0 2px 0 #3730a3}
  /* result */
  .headline{display:flex;align-items:center;gap:22px;padding:22px;border-radius:14px;background:var(--amber-l);border:1px solid #f3d9a4}
  .gauge{position:relative;width:96px;height:96px;flex:none}.gauge svg{transform:rotate(-90deg)}
  .gauge .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .pct b{font-size:26px;line-height:1}.gauge .pct span{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
  .hl-text h3{margin:0 0 3px;font-size:19px}.hl-text p{margin:0;font-size:13px;color:var(--amber-d)}
  .band{display:inline-block;font-size:11px;font-weight:800;padding:2px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
  .band.High{background:#dcfce7;color:var(--good)}.band.Moderate{background:#fef3c7;color:var(--warn)}.band.Low{background:#fee2e2;color:var(--bad)}
  .methodnote{background:#f6f7ff;border:1px solid #dfe1ff;border-radius:10px;padding:11px 14px;font-size:12.5px;color:#4338ca;margin:14px 0 0}
  .sec{margin-top:24px}
  .sec h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--amber-d);margin:0 0 10px;font-weight:800}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
  tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none}
  tr.grand td{font-weight:800;background:var(--amber-l);color:var(--amber-d);border-top:2px solid var(--amber-d);font-size:13.5px}
  .simbar{display:inline-block;height:7px;border-radius:4px;background:var(--amber);vertical-align:middle;margin-right:7px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpi{background:var(--amber-ll);border:1px solid var(--line);border-radius:12px;padding:15px}
  .kpi b{font-size:25px;font-weight:800;display:block;letter-spacing:-.5px}
  .kpi span{font-size:11.5px;color:var(--muted);font-weight:600}
  .flag{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--warn);margin-top:10px;display:flex;gap:9px}
  .flag b{color:var(--amber-d)}
  .flag.good{background:#f0fdf4;border-color:#bbf7d0;color:var(--good)}
  .flag.bad{background:#fef2f2;border-color:#fecaca;color:var(--bad)}
  .audit{font-size:13px;color:var(--muted)}.audit li{margin:5px 0}
  .rolebar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .rolebar .fill{height:20px;border-radius:5px;background:linear-gradient(90deg,var(--amber),var(--amber-d));min-width:2px}
  .disclaimer{font-size:12px;color:var(--muted);margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
  .modrow td:first-child{font-weight:600}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tab{border:1.5px solid var(--line);background:#fff;border-radius:9px 9px 0 0;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
  .tab:hover{border-color:var(--amber)}
  .tab.on{border-color:var(--amber-d);background:var(--amber-l);color:var(--amber-d)}
  .tab .tn{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600}.tab.on .tn{color:var(--amber-d)}
  .hin{width:96px;border:1.5px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;font-family:var(--mono);text-align:right}.hin:focus{outline:none;border-color:var(--amber)}
  .tagcov{font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:#e0e7ff;color:#3730a3;margin-left:6px}
  .tagapp{font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:#fef3c7;color:var(--warn);margin-left:6px}
  @media(max-width:600px){.kpis{grid-template-columns:1fr}.headline{flex-direction:column;text-align:center}}

  .toggle{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
  .tg{border:none;background:#fff;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);font-family:inherit;border-right:1px solid var(--line)}
  .tg:last-child{border-right:none}.tg:hover{background:var(--amber-ll)}.tg.on{background:var(--amber-l);color:var(--amber-d)}
  tr.ext{background:#f6f7ff}
  .sin{border:1.5px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12.5px;font-family:inherit}.sin:focus{outline:none;border-color:var(--amber)}
  .xrow{border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px}.xrow:hover{color:var(--bad)}
  .totgrid{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .tt{display:flex;justify-content:space-between;padding:8px 14px;font-size:13px;border-bottom:1px solid var(--line)}
  .tt span{color:var(--muted)}.tt b{font-family:var(--mono)}
  .tt.amber{background:var(--amber-ll)}.tt.amber b{color:var(--amber-d)}
  .tt.grand{background:var(--amber-l);border-bottom:none}.tt.grand b{color:var(--amber-d);font-size:15px}
  .drivers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
  .driver{background:#fbfaf7;border:1px solid var(--line);border-radius:9px;padding:9px;text-align:center}
  .driver b{font-size:17px;display:block;font-family:var(--mono)}.driver span{font-size:9.5px;color:var(--muted);text-transform:uppercase;display:block;margin-top:2px}
  .driver em{font-size:9px;color:var(--amber-d);font-style:normal;font-weight:700}
  tr.sel{background:var(--amber-ll)} td.comp{font-family:var(--mono);font-size:12px}
  .dl{font-size:11px;color:var(--amber-d);font-weight:700;border:1px solid var(--line);padding:4px 8px;border-radius:7px;background:#fff;cursor:pointer;font-family:inherit}
  details pre{white-space:pre-wrap;font-family:var(--mono);font-size:10.5px;background:#faf8f4;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;max-height:360px}
  details summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--amber-d);margin-top:6px}
  .aiswitch{margin-left:auto;display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:700}
  .aiswitch .tgl{width:44px;height:24px;border-radius:20px;background:#cbd5e1;position:relative;transition:.15s;cursor:pointer;border:none;padding:0}
  .aiswitch .tgl.on{background:var(--indigo)}
  .aiswitch .tgl::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
  .aiswitch .tgl.on::after{left:23px}
  /* number inputs: hide spinners so digits aren't clipped, right-align for readability */
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  table input[type=number]{text-align:right;padding:8px 10px;font-size:13px}
  .gh,.gr,.rw{width:78px}
  .hin{width:96px}
  .gn{width:100%;min-width:150px}
  table td{vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <span class="dot"></span><h1>Workplan Estimator</h1>
    <span class="badge">Guided web app</span>
    <span class="aiswitch"><span id="aistate">AI layer: on</span><button class="tgl on" id="aitoggle" title="Toggle the AI layer"></button></span>
  </div>
  <p class="sub" id="subline">The PM's workplan intake as a self-serve web app. It blends comparable past projects, splits the work by phase, discipline and role, and shows every number. <b>AI on</b> — Claude reads the client scope and lets you steer in plain language.</p>
  <div class="card" id="card"></div>
</div>

<script>
/* ============================================================================
 * Workplan Estimator — deterministic engine (JavaScript port)
 * ----------------------------------------------------------------------------
 * Faithful port of score_comparables.py + estimate_resourcing.py.
 * Same arithmetic, same weights, same bars — so the HTML tools produce the
 * identical numbers to the Python scripts / the Claude demo.
 *
 * Reference date is pinned so the demo is reproducible on any day.
 * Parity-verified against the Python output for demo_candidates.json:
 *   84% High · A 0.838 / B 0.684 / D 0.640 / C 0.555 · 8659.0h
 *   drop C -> 86% High · 8880.5h
 * ========================================================================== */
(function (root) {
  "use strict";

  // Pinned so recency scoring is identical to the 2026-07-23 ground-truth run.
  // (The real script uses date.today(); we pin it for a stable live demo.)
  var REFERENCE_DATE = new Date(Date.UTC(2026, 6, 23)); // months are 0-based

  var MIN_COMPARABLES_BEFORE_BROADENING = 3;
  var MIN_SCORE_BAR = 0.35;
  var MAX_SELECTED = 5;
  var MIN_SELECTED = 3;
  var MAX_TOTAL_UPLIFT = 0.5;

  var WEIGHTS = { typology: 0.4, gfa: 0.25, modifiers: 0.25, recency: 0.1 };

  var CONFIDENCE_WEIGHTS = {
    depth: 0.3,
    match_quality: 0.3,
    typology_fidelity: 0.15,
    modifier_coverage: 0.15,
    gfa_proximity: 0.1,
  };
  var CONFIDENCE_FALLBACK_CAP = 30;
  var CONFIDENCE_BANDS = [ [70, "High"], [45, "Moderate"], [0, "Low"] ];

  var DEFAULT_ADJACENCY = {
    "Elder Care": ["Healthcare"],
    "Healthcare": ["Elder Care"],
    "Municipal": ["Institutional"],
    "Institutional": ["Municipal"],
    "Recreation Centre": ["Arena"],
    "Arena": ["Recreation Centre"],
    "Multi-Use Residential": ["Residential"],
    "Residential": ["Multi-Use Residential"],
  };

  // Indicative blended rate ($/hr). The production tool uses DIALOG's full
  // discipline/title rate taxonomy; this single blended figure reproduces the
  // runbook's "indicative fee" and is always labelled indicative, never final.
  var INDICATIVE_BLENDED_RATE = 208;

  function round(v, n) {
    var f = Math.pow(10, n || 0);
    return Math.round(v * f) / f;
  }

  function gfaScore(newGfa, candGfa) {
    if (!newGfa || !candGfa || newGfa <= 0 || candGfa <= 0) return 0.0;
    var diff = Math.abs(Math.log(newGfa) - Math.log(candGfa));
    return Math.max(0.0, 1.0 - diff / 1.4);
  }

  function modifierScore(newMods, candMods) {
    var a = new Set(newMods || []);
    var b = new Set(candMods || []);
    if (a.size === 0 && b.size === 0) return 1.0;
    var union = new Set([].concat(newMods || [], candMods || []));
    if (union.size === 0) return 1.0;
    var inter = 0;
    a.forEach(function (x) { if (b.has(x)) inter++; });
    return inter / union.size;
  }

  function recencyScore(dateStr, today) {
    if (!dateStr) return 0.5;
    var parts = String(dateStr).split("-");
    if (parts.length !== 3) return 0.5;
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
    if (isNaN(y) || isNaN(m) || isNaN(d)) return 0.5;
    var then = new Date(Date.UTC(y, m - 1, d));
    var ageYears = (today.getTime() - then.getTime()) / (1000 * 60 * 60 * 24) / 365.25;
    return Math.max(0.0, 1.0 - ageYears / 10.0);
  }

  function scoreCandidate(newProject, cand, today, adjacency) {
    var newTyp = newProject.typology, candTyp = cand.typology;
    var typScore;
    if (newTyp === candTyp) typScore = 1.0;
    else if ((adjacency[newTyp] || []).indexOf(candTyp) !== -1) typScore = 0.6;
    else typScore = 0.0;

    var g = gfaScore(newProject.gfa, cand.gfa);
    var m = modifierScore(newProject.modifiers, cand.modifiers);
    var r = recencyScore(cand.date_curated, today);

    var total = WEIGHTS.typology * typScore + WEIGHTS.gfa * g +
      WEIGHTS.modifiers * m + WEIGHTS.recency * r;

    return {
      project_code: cand.project_code,
      typology_score: round(typScore, 3),
      gfa_score: round(g, 3),
      modifier_score: round(m, 3),
      recency_score: round(r, 3),
      total_score: round(total, 3),
      typology_match: typScore === 1.0 ? "exact" : (typScore === 0.6 ? "adjacent" : "none"),
    };
  }

  function blendHours(newProject, selectedFull) {
    var weightSum = 0;
    selectedFull.forEach(function (p) { weightSum += p.score.total_score; });
    if (weightSum === 0) weightSum = 1.0;

    var buckets = {};
    selectedFull.forEach(function (p) {
      var cand = p.cand, score = p.score;
      var gfaRatio = 1.0;
      if (newProject.gfa && cand.gfa && cand.gfa > 0) gfaRatio = newProject.gfa / cand.gfa;
      var w = score.total_score / weightSum;
      (cand.workplan_lines || []).forEach(function (line) {
        var key = [line.phase, line.role_discipline, line.role_seniority].join("␀");
        var scaled = (line.hours || 0) * gfaRatio;
        buckets[key] = (buckets[key] || 0) + scaled * w;
      });
    });

    var grid = Object.keys(buckets).sort().map(function (k) {
      var parts = k.split("␀");
      return { phase: parts[0], role_discipline: parts[1], role_seniority: parts[2], hours: round(buckets[k], 1) };
    }).filter(function (row) { return buckets[[row.phase, row.role_discipline, row.role_seniority].join("␀")] > 0.05; });

    return grid;
  }

  function applyModifierAdjustment(newProject, selectedFull, modifierDefaults) {
    var covered = new Set();
    selectedFull.forEach(function (p) { (p.cand.modifiers || []).forEach(function (m) { covered.add(m); }); });
    var uncovered = (newProject.modifiers || []).filter(function (m) { return !covered.has(m); });

    var applied = {}, warnings = [], totalUplift = 0.0;
    uncovered.forEach(function (m) {
      var pct = modifierDefaults[m];
      if (pct === undefined || pct === null) {
        warnings.push("Modifier '" + m + "' has no comparable coverage and no Default Adjustment % set -- its effect is not represented in this estimate.");
        return;
      }
      applied[m] = pct;
      totalUplift += pct;
    });

    var capped = false;
    if (totalUplift > MAX_TOTAL_UPLIFT) { capped = true; totalUplift = MAX_TOTAL_UPLIFT; }

    return {
      result: { uncovered_modifiers: uncovered, applied_defaults: applied, total_uplift_pct: round(totalUplift, 4), capped: capped },
      warnings: warnings,
    };
  }

  function computeConfidence(selectedScores, selectedFull, newProject, modifierDefaults, usedFallback) {
    var factors = [];
    if (!selectedScores.length) {
      var z = {}; Object.keys(CONFIDENCE_WEIGHTS).forEach(function (k) { z[k] = 0.0; });
      return { confidence_pct: 0, band: "Low", drivers: z, factors: ["No comparables selected -- nothing to build confidence on."], fallback_capped: false };
    }

    var nAbove = usedFallback ? 0 : selectedScores.filter(function (s) { return s.total_score >= MIN_SCORE_BAR; }).length;
    var depth = ({ 0: 0.0, 1: 0.4, 2: 0.7 })[nAbove];
    if (depth === undefined) depth = 1.0;
    factors.push(nAbove + " comparable(s) cleared the " + MIN_SCORE_BAR + " similarity bar" + (usedFallback ? " (fallback below bar used)" : ""));

    var scores = selectedScores.map(function (s) { return s.total_score; });
    var matchQuality = scores.reduce(function (a, b) { return a + b; }, 0) / scores.length;
    factors.push("mean similarity of selected comparables = " + round(matchQuality, 3));

    var exact = selectedScores.filter(function (s) { return s.typology_match === "exact"; }).length;
    var typologyFidelity = exact / selectedScores.length;
    factors.push(exact + "/" + selectedScores.length + " selected are exact-typology matches");

    var newMods = newProject.modifiers || [];
    var modifierCoverage;
    if (!newMods.length) {
      modifierCoverage = 1.0;
      factors.push("no complexity modifiers to cover");
    } else {
      var covered = new Set();
      selectedFull.forEach(function (p) { (p.cand.modifiers || []).forEach(function (m) { covered.add(m); }); });
      var perMod = [], seen = [], defaulted = [], uncov = [];
      newMods.forEach(function (m) {
        if (covered.has(m)) { perMod.push(1.0); seen.push(m); }
        else if (modifierDefaults[m] !== undefined && modifierDefaults[m] !== null) { perMod.push(0.5); defaulted.push(m); }
        else { perMod.push(0.0); uncov.push(m); }
      });
      modifierCoverage = perMod.reduce(function (a, b) { return a + b; }, 0) / perMod.length;
      factors.push("modifiers: " + seen.length + " seen in comparables, " + defaulted.length + " via unvalidated default %, " + uncov.length + " uncovered");
    }

    var gfas = selectedScores.map(function (s) { return s.gfa_score || 0.0; });
    var gfaProximity = gfas.reduce(function (a, b) { return a + b; }, 0) / gfas.length;
    factors.push("mean GFA-proximity of selected = " + round(gfaProximity, 3));

    var drivers = {
      depth: round(depth, 3),
      match_quality: round(matchQuality, 3),
      typology_fidelity: round(typologyFidelity, 3),
      modifier_coverage: round(modifierCoverage, 3),
      gfa_proximity: round(gfaProximity, 3),
    };
    var raw = 0;
    Object.keys(CONFIDENCE_WEIGHTS).forEach(function (k) { raw += CONFIDENCE_WEIGHTS[k] * drivers[k]; });
    raw *= 100;

    var fallbackCapped = false;
    if (usedFallback && raw > CONFIDENCE_FALLBACK_CAP) { raw = CONFIDENCE_FALLBACK_CAP; fallbackCapped = true; factors.push("capped at " + CONFIDENCE_FALLBACK_CAP + "% because no comparable cleared the bar"); }

    var pct = Math.round(raw);
    var band = "Low";
    for (var i = 0; i < CONFIDENCE_BANDS.length; i++) { if (pct >= CONFIDENCE_BANDS[i][0]) { band = CONFIDENCE_BANDS[i][1]; break; } }

    return { confidence_pct: pct, band: band, drivers: drivers, factors: factors, fallback_capped: fallbackCapped };
  }

  function scoreComparables(data) {
    var newProject = data.new_project;
    var candidates = data.candidates || [];
    var modifierDefaults = data.modifier_defaults || {};
    var exampleMode = !!data.example_mode;
    var adjacency = data.typology_adjacency || DEFAULT_ADJACENCY;
    var today = REFERENCE_DATE;

    var exact = candidates.filter(function (c) { return c.typology === newProject.typology; });
    var broadened = false;
    var pool = exact;
    if (exact.length < MIN_COMPARABLES_BEFORE_BROADENING) {
      var adjTyps = adjacency[newProject.typology] || [];
      pool = exact.concat(candidates.filter(function (c) { return adjTyps.indexOf(c.typology) !== -1; }));
      broadened = pool.length > exact.length;
    }

    var scored = pool.map(function (c) { return scoreCandidate(newProject, c, today, adjacency); });
    scored.sort(function (a, b) { return b.total_score - a.total_score; });

    var aboveBar = scored.filter(function (s) { return s.total_score >= MIN_SCORE_BAR; });
    var usedFallback = false, selectedScores;
    if (aboveBar.length) selectedScores = aboveBar.slice(0, MAX_SELECTED);
    else if (scored.length) { usedFallback = true; selectedScores = scored.slice(0, MAX_SELECTED); }
    else selectedScores = [];

    var warnings = [];
    if (usedFallback) {
      var best = selectedScores.length ? selectedScores[0].total_score : 0.0;
      warnings.push("LOW CONFIDENCE: no comparable cleared the " + MIN_SCORE_BAR + " similarity bar (best match scored " + best + ") -- showing the best available match(es) anyway. Treat this estimate as a rough starting point, not a defensible number.");
    } else if (selectedScores.length < MIN_SELECTED) {
      warnings.push("Only " + selectedScores.length + " comparable(s) cleared the similarity bar (" + MIN_SCORE_BAR + ") -- treat this estimate as low-confidence.");
    }

    var byCode = {}; pool.forEach(function (c) { byCode[c.project_code] = c; });
    var selectedFull = selectedScores.map(function (s) { return { cand: byCode[s.project_code], score: s }; });

    warnings = warnings.concat(modApp.warnings);

    if (!selectedFull.length) warnings.push("No candidates existed at all (even after typology broadening) -- nothing to build an estimate from yet.");

    var confidence = computeConfidence(selectedScores, selectedFull, newProject, modifierDefaults, usedFallback);

    if (exampleMode) {

      confidence.example_mode = true;
      confidence.factors = ["EXAMPLE MODE — comparables are fabricated for demonstration; confidence is fixed Low and these numbers are illustrative only, not a real estimate."].concat(confidence.factors);

    }

    return {
      broadened_typology_search: broadened,
      candidates_considered: pool.length,
      all_scored: scored,
      selected: selectedScores,
      used_fallback_below_bar: usedFallback,
      blended_grid: blendedGrid,
      modifier_adjustment: modApp.result,
      confidence: confidence,
      example_mode: exampleMode,
      warnings: warnings,
    };
  }

  /* ---- resourcing ---------------------------------------------------------- */
  var DEFAULT_PHASE_WEEKS = {
    "pre-design": 4, "predesign": 4, "schematic design": 8, "design development": 10,

    "bidding": 4, "contract administration": 40, "construction administration": 40, "post-construction": 4,
  };
  var GENERIC_FALLBACK_WEEKS = 8;
  var DEFAULT_HOURS_PER_WEEK = 37.5;
  var DEFAULT_FTE_ROUNDING = 0.25;

  function roundTo(value, step) {
    if (step <= 0) return round(value, 2);
    return round(Math.round(value / step) * step, 2);
  }
  function roleLabel(disc, sen) {
    if (!sen || sen === "N/A") return disc;

  }
  function resolveDuration(phase, supplied) {
    if (supplied[phase]) return { weeks: parseFloat(supplied[phase]), assumed: false };
    var weeks = DEFAULT_PHASE_WEEKS[String(phase).trim().toLowerCase()];
    if (weeks === undefined) weeks = GENERIC_FALLBACK_WEEKS;
    return { weeks: weeks, assumed: true };
  }
  function fmtG(n) { return parseFloat(n.toFixed(2)).toString(); }

  function estimateResourcing(data) {
    var grid = data.blended_grid;
    var supplied = data.phase_durations_weeks || {};
    var hpw = parseFloat(data.hours_per_week || DEFAULT_HOURS_PER_WEEK);
    var step = parseFloat(data.fte_rounding || DEFAULT_FTE_ROUNDING);

    var phases = [];
    grid.forEach(function (row) { if (phases.indexOf(row.phase) === -1) phases.push(row.phase); });

    var assumedPhases = [], phaseBlocks = [], totalHours = 0.0, totalWeeks = 0.0;

    phases.forEach(function (phase) {
      var rd = resolveDuration(phase, supplied);
      var weeks = rd.weeks;
      if (rd.assumed) assumedPhases.push({ phase: phase, assumed_weeks: weeks });
      totalWeeks += weeks;

      var roles = [], phaseHours = 0.0, phaseFteSum = 0.0;
      grid.forEach(function (row) {
        if (row.phase !== phase) return;
        var hours = parseFloat(row.hours || 0.0);
        phaseHours += hours;
        var rawFte = weeks > 0 ? hours / (weeks * hpw) : 0.0;
        var rounded = roundTo(rawFte, step);
        phaseFteSum += rounded;
        roles.push({
          role: roleLabel(row.role_discipline, row.role_seniority),
          role_discipline: row.role_discipline, role_seniority: row.role_seniority,
          hours: round(hours, 1), fte_raw: round(rawFte, 3), fte: rounded,
          label: fmtG(rounded) + " FTE " + roleLabel(row.role_discipline, row.role_seniority),
        });
      });
      roles.sort(function (a, b) { return b.fte_raw - a.fte_raw; });
      totalHours += phaseHours;
      phaseBlocks.push({ phase: phase, weeks: weeks, duration_assumed: rd.assumed, phase_hours: round(phaseHours, 1), concurrent_fte: round(phaseFteSum, 2), roles: roles });
    });

    var peak = null;
    phaseBlocks.forEach(function (b) { if (!peak || b.concurrent_fte > peak.concurrent_fte) peak = b; });
    var peakTeam = null;
    if (peak) peakTeam = { phase: peak.phase, concurrent_fte: peak.concurrent_fte, roles: peak.roles.filter(function (r) { return r.fte > 0; }).map(function (r) { return r.label; }) };

    var avgFte = totalWeeks > 0 ? round(totalHours / (totalWeeks * hpw), 2) : 0.0;

    var warnings = [];
    if (assumedPhases.length) {
      warnings.push("RESOURCING USES ASSUMED DURATIONS for: " + assumedPhases.map(function (a) { return a.phase; }).join(", ") + ". FTE for these phases is only as good as the assumed schedule -- confirm real phase durations before staffing.");
    }

    return {
      hours_per_week: hpw, fte_rounding: step, total_hours: round(totalHours, 1),
      total_weeks_sequential: totalWeeks, project_average_fte: avgFte, peak_team: peakTeam,
      phases: phaseBlocks, assumptions: assumedPhases, warnings: warnings,
    };
  }

  /* ---- convenience: full run + indicative fee ------------------------------ */
  function estimate(data) {

    });

    // surfaced as a separate flagged note (as the runbook does), NOT compounded
    // silently into the headline number.
    var baseHours = resourcing.total_hours;
    var uplift = scored.modifier_adjustment.total_uplift_pct || 0;
    var fee = Math.round(baseHours * INDICATIVE_BLENDED_RATE);

      scored: scored,
      resourcing: resourcing,
      indicative: {
        blended_rate: INDICATIVE_BLENDED_RATE,
        base_hours: baseHours,
        uplift_pct: uplift,
        fee: fee,

  /* ---- improv / example mode (JS port of make_example.py) -----------------
   * Fabricates a plausible synthetic comparable set for ANY typology/size so a
   * live audience can drive the tool. The arithmetic that follows is genuine;
   * only the comparables are invented, and example_mode pins confidence Low.
   * Uses its own seeded RNG (need not match Python — the canonical runbook case
   * always uses the real demo_candidates.json, never this path). */
  var INTENSITY = {
    Healthcare: 1.6, Lab: 1.7, Institutional: 1.2, Office: 0.8, Commercial: 0.8,
    Residential: 0.7, "Multi-Use Residential": 0.9, "Recreation Centre": 1.1, Arena: 1.1,
    Retail: 0.7, Hospitality: 1.0, "Elder Care": 1.3, Municipal: 1.1, Transit: 1.4,

  var SPLITS = {
    "Schematic Design": [[["Architectural","Senior"],0.25],[["Architectural","Intermediate"],0.25],[["Technologist","Junior"],0.30],[["Project Manager","Senior"],0.20]],
    "Design Development": [[["Architectural","Senior"],0.15],[["Architectural","Intermediate"],0.25],[["Technologist","Junior"],0.40],[["Technologist","Senior Intermediate"],0.10],[["Project Manager","Senior"],0.10]],
    "Contract Documents": [[["Architectural","Senior"],0.10],[["Architectural","Intermediate"],0.10],[["Technologist","Junior"],0.50],[["Technologist","Senior Intermediate"],0.25],[["Project Manager","Senior"],0.05]],
    "Contract Administration": [[["Architectural","Senior"],0.20],[["Technologist","Junior"],0.30],[["Contract Administration","Senior"],0.30],[["Project Manager","Senior"],0.20]],
  };
  var DESCRIPTORS = ["renewal","new build","addition","campus phase","expansion","fit-out","replacement"];
  var OUTCOMES = ["Over","On","Under"];
  var GFA_FACTORS = [0.65,0.85,1.25,1.55,0.5,1.1];
  var YEARS = ["2024-05-01","2023-04-01","2022-06-01","2021-03-01","2020-09-01","2019-07-01"];

  function seededRng(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    var a = h >>> 0;

  function makeExample(typology, gfa, modifiers, n) {
    modifiers = (modifiers || []).filter(function (m) { return m && m.trim(); });
    var sortedMods = modifiers.slice().sort().join(",");
    var rnd = seededRng(typology + "|" + Math.floor(gfa) + "|" + sortedMods);
    var uni = function (lo, hi) { return lo + rnd() * (hi - lo); };
    var intensity = INTENSITY[typology] || DEFAULT_INTENSITY;
    var count = Math.max(3, n || 4);
    var candidates = [];
    for (var i = 0; i < count; i++) {
      var cgfa = Math.round(gfa * GFA_FACTORS[i % GFA_FACTORS.length]);
      var total = cgfa * intensity * uni(0.9, 1.15);
      // Synthetic comparables carry NO modifiers, so the PM's chosen modifiers
      // all surface as applied defaults (visible in the "how they add up" table)
      // rather than being silently absorbed by fabricated coverage.
      var candMods = [];
      var lines = [];
      Object.keys(PHASE_SHARES).forEach(function (phase) {
        var pt = total * PHASE_SHARES[phase] * uni(0.9, 1.1);
        SPLITS[phase].forEach(function (sp) {
          lines.push({ phase: phase, role_discipline: sp[0][0], role_seniority: sp[0][1], hours: round(pt * sp[1], 1) });
        });

      candidates.push({
        project_code: "EX-" + String.fromCharCode(65 + i),
        project_name: typology + " " + DESCRIPTORS[i % DESCRIPTORS.length] + " (synthetic)",
        typology: typology, gfa: cgfa, modifiers: candMods,
        date_curated: YEARS[i % YEARS.length], outcome_judgment: OUTCOMES[i % OUTCOMES.length],
        outcome_notes: "Fabricated example project — illustrative only.", workplan_lines: lines,

      new_project: { typology: typology, gfa: gfa, modifiers: modifiers, delivery_method: "Design-Bid-Build", client_type: "Repeat" },

  /* RAIC cross-check (Method B) — independent sanity check of the estimate

   * ------------------------------------------------------------------------ */
  function fullEstimate(data, opts) {

  if(num)gfa=Math.round(parseFloat(num[1].replace(/[, ]/g,'')));
  if(!gfa){var k=low.match(/(\d[\d\.]*)\s*k\b/);if(k)gfa=Math.round(parseFloat(k[1])*1000);}
  if(!gfa){var nums=(low.match(/\d[\d,\.]*/g)||[]).map(function(n){return parseFloat(n.replace(/,/g,''));}).filter(function(n){return n>=800&&n<=400000;});if(nums.length)gfa=Math.round(Math.max.apply(null,nums));}
  if(gfa)state.gfa=gfa;
  var mods=[];
  function add(rx,name){if(rx.test(low)&&mods.indexOf(name)===-1)mods.push(name);}
  add(/leed|sustainab|net.?zero|carbon|passive house|green building|energy target/,"Sustainability Certification Target");
  add(/fast.?track|tight schedule|accelerat|aggressive schedule|compressed|tight timeline|expedited/,"Fast-Track Schedule");
  add(/heritage|historic/,"Heritage Building");
  add(/renovation|retrofit|existing building/,"Existing Building Renovation (Non-Heritage)");
  add(/phased|occupied|stay.?in.?place/,"Phased / Occupied Construction");
  add(/stakeholder|public consultation|community engagement|user groups/,"Stakeholder-Group Count");
  add(/pool|natatorium|aquatic/,"Pool / Natatorium");
  add(/tall building|high.?rise|tower/,"Tall Building");
  add(/campus|multi-building|multiple buildings/,"Multi-Building Campus");
  add(/first.?time client|new client/,"First-Time Client");
  add(/complex code|code complexity|building code/,"Code Complexity");
  add(/difficult site|unusual site|contaminated|brownfield/,"Unusual Site Conditions");
  if(mods.length)state.modifiers=mods;
  var cv=low.match(/\$?\s*([\d\.]+)\s*(m|million)\b/);if(cv)state.value=Math.round(parseFloat(cv[1])*1e6);
  render();
  var f2=document.getElementById('aifeed');
  if(f2){
    var g=[];
    g.push(typ?'Typology → <b>'+esc(typ)+'</b>':'Typology → <i>not detected — pick below</i>');
    g.push(gfa?'GFA → <b>'+gfa.toLocaleString()+' m²</b>':'GFA → <i>not detected</i>');
    g.push(mods.length?'Modifiers → <b>'+mods.map(esc).join(', ')+'</b>':'Modifiers → <i>none detected</i>');
    if(state.value)g.push('Construction value → <b>$'+(state.value/1e6)+'M</b>');
    var ready=typ&&gfa;
    f2.innerHTML='<div class="aifeed"><b>✦ AI read the scope:</b><br>'+g.join('<br>')+
      (ready?'<br><button class="btn indigo" id="airun" style="margin-top:11px;padding:9px 18px;font-size:13px">Use this → full estimate</button> <button class="btn ghost" id="aireview" style="font-size:13px">review step by step</button>'
            :'<br><span style="color:var(--muted);font-size:12px">Some fields missing — continue the interview to fill them.</span>')+'</div>';
    var ff=document.getElementById('scope'); if(ff) ff.value=state.scope;
    var ar=document.getElementById('airun'); if(ar) ar.onclick=function(){state.step=7;render();};
    var av=document.getElementById('aireview'); if(av) av.onclick=function(){state.step=1;render();};
  }
}

/* ---- editable result view: scope lines + companies ---- */
var EM=null, feeView='dialog', scopeLines=[], adjustMsg='', drillIdx=0, projWeeks=null, projWeeksAssumed=null;
var AI_ON=true;
var PY_SCORE = "\"\"\"Case-based comparable scoring and hours blending for the workplan estimator.\n\nDeterministic arithmetic only -- this script exists so similarity scores and blended\nhours are computed the same way every time, not eyeballed. Claude gathers the input\nJSON (new-project inputs + candidate Projects/WorkplanLines pulled from Airtable) and\npasses it in; this script never talks to Airtable itself.\n\nUsage:\n    python score_comparables.py input.json > result.json\n\nInput JSON shape:\n{\n  \"new_project\": {\n    \"typology\": \"Healthcare\",\n    \"gfa\": 12000,\n    \"modifiers\": [\"Heritage / Existing Building\", \"Fast-Track Schedule\"],\n    \"delivery_method\": \"Design-Bid-Build\",\n    \"client_type\": \"Repeat\"\n  },\n  \"candidates\": [\n    {\n      \"project_code\": \"P1234\",\n      \"typology\": \"Healthcare\",\n      \"gfa\": 15000,\n      \"modifiers\": [\"Fast-Track Schedule\"],\n      \"date_curated\": \"2025-01-15\",\n      \"outcome_judgment\": \"On\",\n      \"outcome_notes\": \"...\",\n      \"workplan_lines\": [\n        {\"phase\": \"Schematic Design\", \"role_discipline\": \"Architectural\",\n         \"role_seniority\": \"Intermediate\", \"hours\": 120}\n      ]\n    }\n  ],\n  \"modifier_defaults\": {\"Heritage / Existing Building\": 0.10},\n  \"typology_adjacency\": {\"Elder Care\": [\"Healthcare\"], \"Healthcare\": [\"Elder Care\"]}\n}\n\nOutput JSON: {\"comparables\": [...scored, ranked...], \"broadened\": bool,\n\"selected\": [...top 3-5 above bar...], \"blended_grid\": [...], \"modifier_adjustment\": {...},\n\"warnings\": [...]}\n\"\"\"\nimport json\nimport math\nimport sys\nfrom datetime import date\n\nMIN_COMPARABLES_BEFORE_BROADENING = 3\nMIN_SCORE_BAR = 0.35\nMAX_SELECTED = 5\nMIN_SELECTED = 3\nMAX_TOTAL_UPLIFT = 0.50\n\nWEIGHTS = {\"typology\": 0.40, \"gfa\": 0.25, \"modifiers\": 0.25, \"recency\": 0.10}\n\n# --- Confidence scoring -----------------------------------------------------\n# How much to trust this estimate, expressed 0-100%. Derived entirely from data\n# the scorer already produces -- no new inputs and no black box: every point\n# traces to a named driver below. This is NOT a probability; it is a transparent\n# composite of \"how much real, close, well-matched evidence did this estimate\n# actually stand on.\"\nCONFIDENCE_WEIGHTS = {\n    \"depth\": 0.30,              # how many comparables cleared the similarity bar\n    \"match_quality\": 0.30,      # how similar the selected comparables actually are\n    \"typology_fidelity\": 0.15,  # exact-typology matches vs. adjacent/broadened\n    \"modifier_coverage\": 0.15,  # new project's modifiers seen in real comparables\n    \"gfa_proximity\": 0.10,      # how close in size the comparables are\n}\n# If nothing cleared the real similarity bar (fallback path), confidence is\n# capped here regardless of the other drivers -- a below-bar draft is a starting\n# point, never a defensible number.\nCONFIDENCE_FALLBACK_CAP = 30\nCONFIDENCE_BANDS = [(70, \"High\"), (45, \"Moderate\"), (0, \"Low\")]\n\nDEFAULT_ADJACENCY = {\n    \"Elder Care\": [\"Healthcare\"],\n    \"Healthcare\": [\"Elder Care\"],\n    \"Municipal\": [\"Institutional\"],\n    \"Institutional\": [\"Municipal\"],\n    \"Recreation Centre\": [\"Arena\"],\n    \"Arena\": [\"Recreation Centre\"],\n    \"Multi-Use Residential\": [\"Residential\"],\n    \"Residential\": [\"Multi-Use Residential\"],\n}\n\n\ndef gfa_score(new_gfa, cand_gfa):\n    if not new_gfa or not cand_gfa or new_gfa <= 0 or cand_gfa <= 0:\n        return 0.0\n    diff = abs(math.log(new_gfa) - math.log(cand_gfa))\n    # A 4x size ratio (log diff ~1.39) drives the score to ~0.\n    return max(0.0, 1.0 - diff / 1.4)\n\n\ndef modifier_score(new_mods, cand_mods):\n    new_set, cand_set = set(new_mods or []), set(cand_mods or [])\n    if not new_set and not cand_set:\n        return 1.0\n    union = new_set | cand_set\n    if not union:\n        return 1.0\n    return len(new_set & cand_set) / len(union)\n\n\ndef recency_score(date_str, today):\n    if not date_str:\n        return 0.5\n    try:\n        y, m, d = (int(x) for x in date_str.split(\"-\"))\n        age_years = (today - date(y, m, d)).days / 365.25\n    except (ValueError, AttributeError):\n        return 0.5\n    return max(0.0, 1.0 - age_years / 10.0)\n\n\ndef score_candidate(new_project, cand, today, adjacency):\n    new_typ = new_project.get(\"typology\")\n    cand_typ = cand.get(\"typology\")\n    if new_typ == cand_typ:\n        typ_score = 1.0\n    elif cand_typ in adjacency.get(new_typ, []):\n        typ_score = 0.6\n    else:\n        typ_score = 0.0\n\n    g_score = gfa_score(new_project.get(\"gfa\"), cand.get(\"gfa\"))\n    m_score = modifier_score(new_project.get(\"modifiers\"), cand.get(\"modifiers\"))\n    r_score = recency_score(cand.get(\"date_curated\"), today)\n\n    total = (\n        WEIGHTS[\"typology\"] * typ_score\n        + WEIGHTS[\"gfa\"] * g_score\n        + WEIGHTS[\"modifiers\"] * m_score\n        + WEIGHTS[\"recency\"] * r_score\n    )\n    return {\n        \"project_code\": cand.get(\"project_code\"),\n        \"typology_score\": round(typ_score, 3),\n        \"gfa_score\": round(g_score, 3),\n        \"modifier_score\": round(m_score, 3),\n        \"recency_score\": round(r_score, 3),\n        \"total_score\": round(total, 3),\n        \"typology_match\": \"exact\" if typ_score == 1.0 else (\"adjacent\" if typ_score == 0.6 else \"none\"),\n    }\n\n\ndef blend_hours(new_project, selected_full):\n    \"\"\"selected_full: list of (candidate_dict, score_dict) tuples for chosen comparables.\"\"\"\n    weights = {c[\"project_code\"]: s[\"total_score\"] for c, s in selected_full}\n    weight_sum = sum(weights.values()) or 1.0\n\n    buckets = {}  # (phase, discipline, seniority) -> weighted hours sum\n    for cand, score in selected_full:\n        gfa_ratio = 1.0\n        new_gfa, cand_gfa = new_project.get(\"gfa\"), cand.get(\"gfa\")\n        if new_gfa and cand_gfa and cand_gfa > 0:\n            gfa_ratio = new_gfa / cand_gfa\n        w = score[\"total_score\"] / weight_sum\n        for line in cand.get(\"workplan_lines\", []):\n            key = (line.get(\"phase\"), line.get(\"role_discipline\"), line.get(\"role_seniority\"))\n            scaled_hours = (line.get(\"hours\") or 0) * gfa_ratio\n            buckets[key] = buckets.get(key, 0.0) + scaled_hours * w\n\n    grid = [\n        {\"phase\": k[0], \"role_discipline\": k[1], \"role_seniority\": k[2], \"hours\": round(v, 1)}\n        for k, v in sorted(buckets.items())\n        if v > 0.05\n    ]\n    return grid\n\n\ndef apply_modifier_adjustment(new_project, selected_full, modifier_defaults):\n    covered = set()\n    for cand, _score in selected_full:\n        covered.update(cand.get(\"modifiers\") or [])\n    uncovered = [m for m in (new_project.get(\"modifiers\") or []) if m not in covered]\n\n    applied = {}\n    warnings = []\n    total_uplift = 0.0\n    for m in uncovered:\n        pct = modifier_defaults.get(m)\n        if pct is None:\n            warnings.append(\n                f\"Modifier '{m}' has no comparable coverage and no Default Adjustment %% set \"\n                f\"-- its effect is not represented in this estimate.\"\n            )\n            continue\n        applied[m] = pct\n        total_uplift += pct\n\n    capped = False\n    if total_uplift > MAX_TOTAL_UPLIFT:\n        capped = True\n        total_uplift = MAX_TOTAL_UPLIFT\n\n    return {\n        \"uncovered_modifiers\": uncovered,\n        \"applied_defaults\": applied,\n        \"total_uplift_pct\": round(total_uplift, 4),\n        \"capped\": capped,\n    }, warnings\n\n\ndef compute_confidence(selected_scores, selected_full, new_project,\n                       modifier_defaults, used_fallback_below_bar):\n    \"\"\"Transparent 0-100% trust score for the estimate + its driver breakdown.\n\n    Consumes only what the scorer already computed. Returns a dict with the\n    headline pct, a band label, each driver's 0-1 value, and a list of short,\n    human-readable factors the skill can drop straight into the 'how this was\n    built' narrative -- so the number is auditable, never a black box.\n    \"\"\"\n    factors = []\n\n    if not selected_scores:\n        return {\n            \"confidence_pct\": 0,\n            \"band\": \"Low\",\n            \"drivers\": {k: 0.0 for k in CONFIDENCE_WEIGHTS},\n            \"factors\": [\"No comparables selected -- nothing to build confidence on.\"],\n            \"fallback_capped\": False,\n        }\n\n    n_above = 0 if used_fallback_below_bar else sum(\n        1 for s in selected_scores if s[\"total_score\"] >= MIN_SCORE_BAR\n    )\n    depth = {0: 0.0, 1: 0.4, 2: 0.7}.get(n_above, 1.0)\n    factors.append(\n        f\"{n_above} comparable(s) cleared the {MIN_SCORE_BAR} similarity bar\"\n        + (\" (fallback below bar used)\" if used_fallback_below_bar else \"\")\n    )\n\n    scores = [s[\"total_score\"] for s in selected_scores]\n    match_quality = sum(scores) / len(scores)\n    factors.append(f\"mean similarity of selected comparables = {round(match_quality, 3)}\")\n\n    exact = sum(1 for s in selected_scores if s.get(\"typology_match\") == \"exact\")\n    typology_fidelity = exact / len(selected_scores)\n    factors.append(f\"{exact}/{len(selected_scores)} selected are exact-typology matches\")\n\n    new_mods = new_project.get(\"modifiers\") or []\n    if not new_mods:\n        modifier_coverage = 1.0\n        factors.append(\"no complexity modifiers to cover\")\n    else:\n        covered = set()\n        for cand, _s in selected_full:\n            covered.update(cand.get(\"modifiers\") or [])\n        per_mod = []\n        seen_by_comparable, defaulted, uncovered = [], [], []\n        for m in new_mods:\n            if m in covered:\n                per_mod.append(1.0); seen_by_comparable.append(m)\n            elif modifier_defaults.get(m) is not None:\n                per_mod.append(0.5); defaulted.append(m)\n            else:\n                per_mod.append(0.0); uncovered.append(m)\n        modifier_coverage = sum(per_mod) / len(per_mod)\n        factors.append(\n            f\"modifiers: {len(seen_by_comparable)} seen in comparables, \"\n            f\"{len(defaulted)} via unvalidated default %, {len(uncovered)} uncovered\"\n        )\n\n    gfas = [s.get(\"gfa_score\", 0.0) for s in selected_scores]\n    gfa_proximity = sum(gfas) / len(gfas)\n    factors.append(f\"mean GFA-proximity of selected = {round(gfa_proximity, 3)}\")\n\n    drivers = {\n        \"depth\": round(depth, 3),\n        \"match_quality\": round(match_quality, 3),\n        \"typology_fidelity\": round(typology_fidelity, 3),\n        \"modifier_coverage\": round(modifier_coverage, 3),\n        \"gfa_proximity\": round(gfa_proximity, 3),\n    }\n    raw = sum(CONFIDENCE_WEIGHTS[k] * drivers[k] for k in CONFIDENCE_WEIGHTS) * 100\n\n    fallback_capped = False\n    if used_fallback_below_bar and raw > CONFIDENCE_FALLBACK_CAP:\n        raw = CONFIDENCE_FALLBACK_CAP\n        fallback_capped = True\n        factors.append(f\"capped at {CONFIDENCE_FALLBACK_CAP}% because no comparable cleared the bar\")\n\n    pct = int(round(raw))\n    band = next(label for threshold, label in CONFIDENCE_BANDS if pct >= threshold)\n\n    return {\n        \"confidence_pct\": pct,\n        \"band\": band,\n        \"drivers\": drivers,\n        \"factors\": factors,\n        \"fallback_capped\": fallback_capped,\n    }\n\n\ndef main():\n    data = json.load(open(sys.argv[1], encoding=\"utf-8\")) if len(sys.argv) > 1 else json.load(sys.stdin)\n    new_project = data[\"new_project\"]\n    candidates = data[\"candidates\"]\n    modifier_defaults = data.get(\"modifier_defaults\", {})\n    example_mode = bool(data.get(\"example_mode\", False))  # demo/improv flag -- see below\n    adjacency = data.get(\"typology_adjacency\") or DEFAULT_ADJACENCY\n    today = date.today()  # only used for recency scoring; caller may override via candidate dates\n\n    exact = [c for c in candidates if c.get(\"typology\") == new_project.get(\"typology\")]\n    broadened = False\n    pool = exact\n    if len(exact) < MIN_COMPARABLES_BEFORE_BROADENING:\n        adjacent_typs = adjacency.get(new_project.get(\"typology\"), [])\n        pool = exact + [c for c in candidates if c.get(\"typology\") in adjacent_typs]\n        broadened = len(pool) > len(exact)\n\n    scored = [score_candidate(new_project, c, today, adjacency) for c in pool]\n    scored.sort(key=lambda s: s[\"total_score\"], reverse=True)\n\n    above_bar = [s for s in scored if s[\"total_score\"] >= MIN_SCORE_BAR]\n    used_fallback_below_bar = False\n    if above_bar:\n        selected_scores = above_bar[:MAX_SELECTED]\n    elif scored:\n        # Nothing cleared the real similarity bar. Rather than blocking output\n        # entirely, fall back to the best available candidates anyway -- during\n        # early bootstrapping (small seed set) a reactable low-confidence draft\n        # is more useful than nothing. Confidence is communicated via the\n        # warning below, not by withholding the number.\n        used_fallback_below_bar = True\n        selected_scores = scored[:MAX_SELECTED]\n    else:\n        selected_scores = []\n\n    warnings = []\n    if used_fallback_below_bar:\n        best = selected_scores[0][\"total_score\"] if selected_scores else 0.0\n        warnings.append(\n            f\"LOW CONFIDENCE: no comparable cleared the {MIN_SCORE_BAR} similarity bar \"\n            f\"(best match scored {best}) -- showing the best available match(es) anyway. \"\n            f\"Treat this estimate as a rough starting point, not a defensible number.\"\n        )\n    elif len(selected_scores) < MIN_SELECTED:\n        warnings.append(\n            f\"Only {len(selected_scores)} comparable(s) cleared the similarity bar \"\n            f\"({MIN_SCORE_BAR}) -- treat this estimate as low-confidence.\"\n        )\n\n    by_code = {c.get(\"project_code\"): c for c in pool}\n    selected_full = [(by_code[s[\"project_code\"]], s) for s in selected_scores]\n\n    blended_grid = blend_hours(new_project, selected_full) if selected_full else []\n    modifier_result, mod_warnings = apply_modifier_adjustment(new_project, selected_full, modifier_defaults)\n    warnings.extend(mod_warnings)\n\n    if not selected_full:\n        warnings.append(\n            \"No candidates existed at all (even after typology broadening) -- \"\n            \"nothing to build an estimate from yet.\"\n        )\n\n    confidence = compute_confidence(\n        selected_scores, selected_full, new_project, modifier_defaults, used_fallback_below_bar\n    )\n\n    if example_mode:\n        # EXAMPLE / IMPROV MODE: the comparables were fabricated on the fly (e.g. by\n        # demo/make_example.py) so a live audience can pick ANY project and still see a\n        # full, real-format result. The arithmetic is genuine, but the inputs are not real\n        # projects -- so confidence is honestly pinned Low and loudly banner-stamped, and a\n        # top-level warning makes clear this is a demonstration, not an estimate.\n        confidence[\"confidence_pct\"] = min(confidence.get(\"confidence_pct\", 0), 20)\n        confidence[\"band\"] = \"Low\"\n        confidence[\"example_mode\"] = True\n        confidence[\"factors\"] = [\n            \"EXAMPLE MODE — comparables are fabricated for demonstration; confidence is fixed \"\n            \"Low and these numbers are illustrative only, not a real estimate.\"\n        ] + confidence.get(\"factors\", [])\n        warnings.insert(0,\n            \"EXAMPLE MODE: this result is built from synthetic, made-up comparable projects for \"\n            \"a live demonstration. The hours, fee, and resourcing are illustrative only.\"\n        )\n\n    result = {\n        \"broadened_typology_search\": broadened,\n        \"candidates_considered\": len(pool),\n        \"all_scored\": scored,\n        \"selected\": selected_scores,\n        \"used_fallback_below_bar\": used_fallback_below_bar,\n        \"blended_grid\": blended_grid,\n        \"modifier_adjustment\": modifier_result,\n        \"confidence\": confidence,\n        \"example_mode\": example_mode,\n        \"warnings\": warnings,\n    }\n    print(json.dumps(result, indent=2))\n\n\nif __name__ == \"__main__\":\n    main()\n";
var PY_RES = "\"\"\"Turn an approved blended workplan grid into a resourcing (FTE) recommendation.\n\nDeterministic arithmetic only -- same discipline as score_comparables.py: the\nLLM never eyeballs headcount, this script computes it reproducibly. An hours\nestimate answers \"how much effort\"; a PM staffing a project also needs \"how many\npeople, of what seniority, when.\" That conversion needs a time dimension the rest\nof the tool doesn't capture, so this script takes phase durations (in weeks) as an\ninput. When a duration isn't supplied it falls back to a documented default and\nflags that phase loudly -- an assumed schedule must never masquerade as a known one.\n\nFTE for a (phase, role) = phase-role hours / (phase weeks x hours_per_week).\n\nUsage:\n    python estimate_resourcing.py input.json > resourcing.json\n\nInput JSON shape:\n{\n  \"blended_grid\": [                      # score_comparables.py output, post-approval\n    {\"phase\": \"Schematic Design\", \"role_discipline\": \"Architectural\",\n     \"role_seniority\": \"Junior\", \"hours\": 300.0},\n    ...\n  ],\n  \"phase_durations_weeks\": {             # optional; per-phase calendar duration\n    \"Schematic Design\": 8,\n    \"Design Development\": 10\n  },\n  \"hours_per_week\": 37.5,                # optional; DIALOG standard work week\n  \"fte_rounding\": 0.25                   # optional; granularity of reported FTE\n}\n\nOutput JSON: per-phase FTE by role, a peak-concurrent-team headline with role mix,\nproject-average FTE, and an `assumptions` block listing every phase whose duration\nwas defaulted rather than supplied.\n\"\"\"\nimport json\nimport sys\n\n# Documented fallback durations (calendar weeks) used ONLY when the caller does\n# not supply a duration for a phase. Deliberately conservative, generic-mid-size\n# figures -- every use of one is flagged in the output so it is never mistaken\n# for a real, project-specific schedule. Keyed by lowercased phase name; unknown\n# phases fall back to GENERIC_FALLBACK_WEEKS.\nDEFAULT_PHASE_WEEKS = {\n    \"pre-design\": 4,\n    \"predesign\": 4,\n    \"schematic design\": 8,\n    \"design development\": 10,\n    \"contract documents\": 14,\n    \"construction documents\": 14,\n    \"permit\": 6,\n    \"tender\": 4,\n    \"bidding\": 4,\n    \"contract administration\": 40,\n    \"construction administration\": 40,\n    \"post-construction\": 4,\n}\nGENERIC_FALLBACK_WEEKS = 8\nDEFAULT_HOURS_PER_WEEK = 37.5\nDEFAULT_FTE_ROUNDING = 0.25\n\n\ndef round_to(value, step):\n    if step <= 0:\n        return round(value, 2)\n    return round(round(value / step) * step, 2)\n\n\ndef role_label(discipline, seniority):\n    if not seniority or seniority == \"N/A\":\n        return discipline\n    return f\"{discipline} - {seniority}\"\n\n\ndef resolve_duration(phase, supplied):\n    if phase in supplied and supplied[phase]:\n        return float(supplied[phase]), False\n    weeks = DEFAULT_PHASE_WEEKS.get(phase.strip().lower(), GENERIC_FALLBACK_WEEKS)\n    return float(weeks), True\n\n\ndef main():\n    data = json.load(open(sys.argv[1], encoding=\"utf-8\")) if len(sys.argv) > 1 else json.load(sys.stdin)\n    grid = data[\"blended_grid\"]\n    supplied = data.get(\"phase_durations_weeks\") or {}\n    hpw = float(data.get(\"hours_per_week\") or DEFAULT_HOURS_PER_WEEK)\n    step = float(data.get(\"fte_rounding\") or DEFAULT_FTE_ROUNDING)\n\n    # Phases in first-seen order.\n    phases = []\n    for row in grid:\n        if row[\"phase\"] not in phases:\n            phases.append(row[\"phase\"])\n\n    assumed_phases = []\n    phase_blocks = []\n    total_hours = 0.0\n    total_weeks = 0.0\n\n    for phase in phases:\n        weeks, assumed = resolve_duration(phase, supplied)\n        if assumed:\n            assumed_phases.append({\"phase\": phase, \"assumed_weeks\": weeks})\n        total_weeks += weeks\n\n        roles = []\n        phase_hours = 0.0\n        phase_fte_sum = 0.0\n        for row in grid:\n            if row[\"phase\"] != phase:\n                continue\n            hours = float(row.get(\"hours\") or 0.0)\n            phase_hours += hours\n            raw_fte = hours / (weeks * hpw) if weeks > 0 else 0.0\n            rounded = round_to(raw_fte, step)\n            phase_fte_sum += rounded\n            roles.append({\n                \"role\": role_label(row[\"role_discipline\"], row[\"role_seniority\"]),\n                \"role_discipline\": row[\"role_discipline\"],\n                \"role_seniority\": row[\"role_seniority\"],\n                \"hours\": round(hours, 1),\n                \"fte_raw\": round(raw_fte, 3),\n                \"fte\": rounded,\n                \"label\": f\"{rounded:g} FTE {role_label(row['role_discipline'], row['role_seniority'])}\",\n            })\n        roles.sort(key=lambda r: r[\"fte_raw\"], reverse=True)\n        total_hours += phase_hours\n        phase_blocks.append({\n            \"phase\": phase,\n            \"weeks\": weeks,\n            \"duration_assumed\": assumed,\n            \"phase_hours\": round(phase_hours, 1),\n            \"concurrent_fte\": round(phase_fte_sum, 2),\n            \"roles\": roles,\n        })\n\n    # Peak concurrent team = the phase demanding the most simultaneous FTE.\n    peak = max(phase_blocks, key=lambda b: b[\"concurrent_fte\"]) if phase_blocks else None\n    peak_team = None\n    if peak:\n        peak_team = {\n            \"phase\": peak[\"phase\"],\n            \"concurrent_fte\": peak[\"concurrent_fte\"],\n            \"roles\": [r[\"label\"] for r in peak[\"roles\"] if r[\"fte\"] > 0],\n        }\n\n    avg_fte = round(total_hours / (total_weeks * hpw), 2) if total_weeks > 0 else 0.0\n\n    warnings = []\n    if assumed_phases:\n        names = \", \".join(a[\"phase\"] for a in assumed_phases)\n        warnings.append(\n            \"RESOURCING USES ASSUMED DURATIONS for: \" + names + \". FTE for these phases is only \"\n            \"as good as the assumed schedule -- confirm real phase durations before staffing.\"\n        )\n\n    result = {\n        \"hours_per_week\": hpw,\n        \"fte_rounding\": step,\n        \"total_hours\": round(total_hours, 1),\n        \"total_weeks_sequential\": total_weeks,\n        \"project_average_fte\": avg_fte,\n        \"peak_team\": peak_team,\n        \"phases\": phase_blocks,\n        \"assumptions\": assumed_phases,\n        \"warnings\": warnings,\n    }\n    print(json.dumps(result, indent=2))\n\n\nif __name__ == \"__main__\":\n    main()\n";

function discFromText(low){

     '<div class="aibox"><div class="lbl">◇ Ask Claude to adapt the workplan — plain language</div>'+
     '<textarea class="scope" id="adjinput" placeholder="e.g. “add a LEED / sustainability target and drop Tall Building”, “make Structural the prime”, “increase Electrical by 15%”, “add a second Mechanical as an outside consultant”, “set everything outside”…" style="min-height:64px"></textarea>'+
     '<button class="btn indigo" id="doadjust" style="margin-top:11px;padding:10px 18px;font-size:13px">✦ Send to Claude</button>'+
     (adjustMsg?'<div class="aifeed'+(/class="warn"/.test(adjustMsg)?' warn':'')+'">'+adjustMsg+'</div>':'')+
     '<p><b>This is a simulated Claude, not a live API.</b> A local interpreter stands in for the model and emits the same <b>tool calls</b> a real Anthropic API call would return — Claude only ever <i>selects inputs</i> (modifiers, prime, hours, companies) and the deterministic engine does the math, so every number stays auditable. Dropping in the real API means replacing the parser with one <code>messages.create</code> call; the executor is unchanged.</p>'+
     '<details style="margin-top:6px"><summary style="cursor:pointer;font-size:11.5px;font-weight:700;color:var(--amber-d)">Tool schema Claude can call ('+WORKPLAN_TOOLS.length+')</summary>'+
     '<ul class="audit" style="margin:8px 0 0;padding-left:18px">'+WORKPLAN_TOOLS.map(function(t){return '<li><code style="background:#e0e7ff;color:#3730a3;padding:1px 6px;border-radius:5px;font-size:11px">'+esc(t.name)+'('+esc(t.args)+')</code> — '+esc(t.desc)+'</li>';}).join('')+'</ul></details>'+
     '</div></div>';
  } else {
  h+='<div class="sec"><h4>Reference engine (embedded)</h4>'+
     '<p style="font-size:12px;color:var(--muted);margin:0 0 6px">The math runs in JavaScript for offline speed — a line-for-line port of the firm’s Python, shipped inside this file and verified identical. This is the "no black box" proof: open the source the numbers came from.</p>'+
     '<details><summary>score_comparables.py</summary><pre>'+esc(PY_SCORE)+'</pre></details>'+
     '<details><summary>estimate_resourcing.py</summary><pre>'+esc(PY_RES)+'</pre></details></div>';
  }
  h+='<p class="disclaimer">A <b>draft starting point for the PM\'s judgment</b>, not a final fee. In production the approved draft writes into the firm\'s Excel workplan template — <b>out of scope for this demo</b>. '+(AI_ON?'AI layer is a simulated Claude; flip the header switch for the deterministic, no-AI view.':'Deterministic, no-AI view; flip the header switch to bring Claude back.')+'</p>';
  h+='<div class="nav"><button class="btn ghost" id="restart">‹ New estimate</button><span></span></div>';
  card.innerHTML=h;
  adjustMsg='';
  var ai=document.getElementById('doadjust');if(ai)ai.onclick=function(){adjust(document.getElementById('adjinput').value);};
  var dco=document.getElementById('drillco');if(dco)dco.onchange=function(){var c=dco.value;for(var i=0;i<scopeLines.length;i++){if(scopeLines[i].company===c){drillIdx=i;break;}}renderResult();};
  var ddi=document.getElementById('drilldi');if(ddi)ddi.onchange=function(){drillIdx=parseInt(ddi.value,10)||0;renderResult();};
  Array.prototype.forEach.call(card.querySelectorAll('.gh'),function(inp){inp.onchange=function(){var L=scopeLines[drillIdx];if(L&&L.grid&&L.grid[inp.dataset.r]){L.grid[inp.dataset.r].ph[inp.dataset.p]=parseFloat(inp.value)||0;resyncLine(L);}renderResult();};});
  Array.prototype.forEach.call(card.querySelectorAll('.gr'),function(inp){inp.onchange=function(){var L=scopeLines[drillIdx];if(L&&L.grid&&L.grid[inp.dataset.r]){L.grid[inp.dataset.r].rate=parseFloat(inp.value)||0;resyncLine(L);}renderResult();};});
  Array.prototype.forEach.call(card.querySelectorAll('.gn'),function(inp){inp.onchange=function(){var L=scopeLines[drillIdx];if(L&&L.grid&&L.grid[inp.dataset.r])L.grid[inp.dataset.r].role=inp.value;renderResult();};});
  Array.prototype.forEach.call(card.querySelectorAll('.gx'),function(b){b.onclick=function(){var L=scopeLines[drillIdx];if(L&&L.grid){L.grid.splice(b.dataset.r,1);resyncLine(L);}renderResult();};});
  var gar=document.getElementById('gaddrole');if(gar)gar.onclick=function(){var L=scopeLines[drillIdx];if(L){if(!L.grid)L.grid=[];L.grid.push({role:'New role',rate:parseFloat(L.rate)||190,ph:[0,0,0,0]});}renderResult();};
  Array.prototype.forEach.call(card.querySelectorAll('.rw'),function(inp){inp.onchange=function(){var p=inp.dataset.p;projWeeks[p]=parseFloat(inp.value)||1;projWeeksAssumed[p]=false;renderResult();};});

  Array.prototype.forEach.call(card.querySelectorAll('.tg[data-fv]'),function(b){b.onclick=function(){feeView=b.dataset.fv;renderResult();};});
  Array.prototype.forEach.call(card.querySelectorAll('.tg[data-mode]'),function(b){b.onclick=function(){setMode(b.dataset.mode);};});
  Array.prototype.forEach.call(card.querySelectorAll('.sin'),function(inp){inp.onchange=function(){var l=scopeLines[inp.dataset.i],k=inp.dataset.k;l[k]=(k==='hours'||k==='rate')?(parseFloat(inp.value)||0):inp.value;renderResult();};});
  Array.prototype.forEach.call(card.querySelectorAll('.sck'),function(cb){cb.onchange=function(){var l=scopeLines[cb.dataset.i];l.inhouse=cb.checked;if(l.inhouse){if(!l.company||/consultant|external/i.test(l.company))l.company='DIALOG';}else{if(l.company==='DIALOG')l.company='External consultant';}renderResult();};});
  Array.prototype.forEach.call(card.querySelectorAll('.xrow'),function(b){b.onclick=function(){scopeLines.splice(b.dataset.del,1);renderResult();};});
  var al=document.getElementById('addline');if(al)al.onclick=function(){var dn=document.getElementById('addsel').value;scopeLines.push({disc:dn,sub:'',company:'DIALOG',inhouse:true,hours:0,rate:discBlendRate(dn),prime:false});renderResult();};
  var dc=document.getElementById('dropc');if(dc)dc.onclick=function(){state.droppedC=true;result();};
  var rc=document.getElementById('restorec');if(rc)rc.onclick=function(){state.droppedC=false;result();};
  document.getElementById('restart').onclick=function(){projWeeks=null;projWeeksAssumed=null;drillIdx=0;state={step:0,scope:'',engagement:'full',soloDisc:'Architecture / Prime',typology:null,gfa:null,disciplines:defDisc(),modifiers:[],value:null,useDefaults:true,droppedC:false};render();};
}

/* AI layer toggle — flips the whole app between AI-assisted and deterministic/no-AI */
(function(){var t=document.getElementById('aitoggle');if(!t)return;
  t.onclick=function(){AI_ON=!AI_ON;
    t.className='tgl'+(AI_ON?' on':'');
    var st=document.getElementById('aistate');if(st)st.textContent='AI layer: '+(AI_ON?'on':'off');
    var sb=document.getElementById('subline');if(sb)sb.innerHTML=AI_ON
      ? 'The PM\'s workplan intake as a self-serve web app. It blends comparable past projects, splits the work by phase, discipline and role, and shows every number. <b>AI on</b> — Claude reads the client scope and lets you steer in plain language.'
      : 'The PM\'s workplan intake as a self-serve web app. It blends comparable past projects, splits the work by phase, discipline and role, and shows every number. <b>AI off</b> — deterministic mode: no AI, every number traces to comparables and the embedded Python.';
    render();};
})();
render();
</script>
